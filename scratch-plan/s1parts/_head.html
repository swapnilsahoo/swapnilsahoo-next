<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 1: Introduction to Strategy | Cautionary Tales, A Dual Lens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sticky-offset: 100px; /* Default offset, updated by JS */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            color: #1f2937; /* gray-800 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        html {
            scroll-behavior: smooth;
        }
        .active-nav {
            color: #2563eb; /* text-blue-600 */
            border-bottom-color: #2563eb;
            font-weight: 600;
        }
        .nav-link {
            transition: all 0.2s ease-in-out;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px; /* Align with active state */
            color: #4b5563; /* text-gray-600 */
        }
        .nav-link:hover {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            max-height: 350px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 350px;
                 max-height: 400px;
            }
        }

        .analysis-content {
             max-height: 0;
             overflow: hidden;
             transition: max-height 0.5s ease-out, opacity 0.3s ease-out, margin-top 0.5s ease-out;
             opacity: 0;
             margin-top: 0;
        }
        .analysis-content.visible {
             max-height: 500px; /* Adjust as needed */
             opacity: 1;
             margin-top: 1rem;
        }
         .analysis-button {
             transition: background-color 0.2s ease;
         }

        .quiz-option { cursor: pointer; transition: all 0.2s ease-in-out; }
        .quiz-option.correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: 500; }
        .quiz-option.incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; font-weight: 500; }
        .quiz-option:disabled { opacity: 0.8; cursor: default; }
        .quiz-explanation { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-in-out, margin-top 0.5s ease-in-out, opacity 0.5s ease-in-out; margin-top: 0; opacity: 0; }
        .quiz-explanation.visible { opacity: 1; margin-top: 1rem; }

        /* Top bar icon styling */
        .top-bar-link svg, .footer-link svg { width: 1.125rem; height: 1.125rem; fill: currentColor; transition: color 0.2s ease-in-out; }
        /* Custom Hexagon Icon Styles */
        .hexagon-icon { position: relative; width: 28px; height: 28px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); display: inline-block; vertical-align: middle; }
        .hexagon-icon svg { width: 100%; height: 100%; animation: glow 2.5s infinite ease-in-out; }
        .hexagon-path { stroke: #B91C1C; stroke-width: 1; }
        .hexagon-s { font-family: 'Georgia', serif; font-weight: bold; font-size: 48px; fill: #facc15; text-anchor: middle; dominant-baseline: central; }
        /* Glow Animation */
        @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.7)); } 50% { filter: drop-shadow(0 0 10px rgba(239, 68, 68, 1)); } }
        /* Sticky Header Logic */
        #main-header.sticky-nav { position: sticky; z-index: 40; }
        #top-bar.sticky-top { position: sticky; top: 0; z-index: 50; }

        /* Modal Styling */
        #modal { background-color: rgba(0, 0, 0, 0.7); }
        #modal-content { max-height: calc(100vh - 4rem); }

        /* Scroll Margin */
         section[id] { scroll-margin-top: var(--sticky-offset); }

         /* Positioning & Fit examples styling */
        .concept-card { background-color: #ffffff; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05); padding: 1.5rem; margin-bottom: 1.5rem; border-left: 4px solid; transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; height: 100%; }
        .concept-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.07); }
        .concept-card h4 { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.75rem; }
        .concept-card p.definition { font-style: italic; color: #6b7280; margin-bottom: 1rem; font-size: 0.875rem; flex-grow: 1; }
        .concept-card .example { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; }
        .concept-card .example:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
        .concept-card .example h5 { font-weight: 600; color: #374151; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .concept-card .example p { font-size: 0.875rem; color: #4b5563; margin-bottom: 0.25rem; line-height: 1.5; }
        .concept-card .example strong { color: #1f2937; }
        .border-needs { border-left-color: #f43f5e; } .border-variety { border-left-color: #0ea5e9; } .border-access { border-left-color: #10b981; }
        .border-fit1 { border-left-color: #fbbf24; } .border-fit2 { border-left-color: #f97316; } .border-fit3 { border-left-color: #ef4444; }

        /* General Prose Styling */
        .prose-custom p, .prose-custom ul, .prose-custom li { font-size: 0.875rem; line-height: 1.6; color: #374151; }
        .prose-custom p { margin-bottom: 1em; } .prose-custom ul { margin-top: 0.5em; margin-bottom: 1em; padding-left: 1.25em; list-style-type: disc; }
        .prose-custom li { margin-bottom: 0.25em; } .prose-custom strong { font-weight: 600; color: #111827; }

        /* Table Styling */
        .comparison-table th, .comparison-table td { padding: 0.75rem 1rem; vertical-align: top; font-size: 0.75rem; }
        .comparison-table thead th { background-color: #f3f4f6; border-bottom: 2px solid #e5e7eb; }
        .comparison-table tbody tr:nth-child(even) { background-color: #f9fafb; } .comparison-table tbody tr:hover { background-color: #eff6ff; }
        .comparison-table th[scope="row"] { white-space: nowrap; }

        /* Activity Button Styling */
        .activity-button { padding: 0.75rem 1rem; border-radius: 0.5rem; text-align: left; transition: all 0.2s ease-in-out; font-size: 0.875rem; border-width: 1px; display: block; width: 100%; height: 100%; }
        .activity-button strong { display: block; margin-bottom: 0.25rem; font-weight: 600; }
        .activity-button:focus { outline: none; box-shadow: 0 0 0 2px var(--tw-ring-color); }
        .activity-button:focus-visible { box-shadow: 0 0 0 2px var(--tw-ring-color); }
        .workshop-button { background-color: #f3e8ff; border-color: #e9d5ff; --tw-ring-color: #c084fc; color: #581c87; } .workshop-button:hover { background-color: #e9d5ff; border-color: #d8b4fe;} .workshop-button strong { color: #7e22ce; } .workshop-button:hover strong { color: #6b21a8; }
        .news-button { background-color: #dbeafe; border-color: #bfdbfe; --tw-ring-color: #60a5fa; color: #1e40af; } .news-button:hover { background-color: #bfdbfe; border-color: #93c5fd;} .news-button strong { color: #1d4ed8; } .news-button:hover strong { color: #1e3a8a; }
        .tradeoff-button { background-color: #fef3c7; border-color: #fde68a; --tw-ring-color: #fbbf24; color: #78350f; } .tradeoff-button:hover { background-color: #fde68a; border-color: #fcd34d;} .tradeoff-button strong { color: #b45309; } .tradeoff-button:hover strong { color: #92400e; }
        .simulation-button { background-color: #ffe4e6; border-color: #fecdd3; --tw-ring-color: #fb7185; color: #881337; } .simulation-button:hover { background-color: #fecdd3; border-color: #fda4af;} .simulation-button strong { color: #be123c; } .simulation-button:hover strong { color: #9f1239; }

    </style>
    <link rel="stylesheet" href="/teaching/responsive.css">
</head>
