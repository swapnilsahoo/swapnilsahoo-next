    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Chart Data & Functions
            const chartData = {
                nokia: { labels: ['2007', '2008', '2009', '2010', '2011', '2012', '2013'], data: [50.8, 43.7, 41.1, 32.8, 23.9, 4.3, 3.1], borderColor: '#0e7490' },
                kodak: { labels: ['1996', '2000', '2004', '2008', '2012'], data: [28, 22, 10, 1.5, 0.1], borderColor: '#d97706' },
                yahoo: { labels: ['2000', '2004', '2008', '2012', '2017'], data: [125, 40, 20, 19, 4.48], borderColor: '#4f46e5' }
            };
            function createChart(company) { /* ... Chart creation logic as before ... */
                const ctx = document.getElementById(`${company}Chart`);
                if (!ctx) return;
                const data = chartData[company];
                const title = company === 'nokia' ? 'Global Smartphone Market Share (%)' : 'Market Capitalization ($ Billions)';
                new Chart(ctx.getContext('2d'), {
                    type: 'line', data: { labels: data.labels, datasets: [{ label: title, data: data.data, borderColor: data.borderColor, backgroundColor: data.borderColor + '20', borderWidth: 2, pointBackgroundColor: data.borderColor, pointRadius: 3, fill: true, tension: 0.1 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false, bodySpacing: 4, titleSpacing: 6, padding: 8, boxPadding: 4 } }, scales: { y: { beginAtZero: true, grid: { color: '#e5e7eb' }, ticks: { font: { size: 10 }, callback: (value) => company === 'nokia' ? value + '%' : '$' + value + 'B' } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
                });
             }
             ['nokia', 'kodak', 'yahoo'].forEach(createChart);

             // Modal Logic (as before)
             const modal = document.getElementById('modal');
             const modalContent = document.getElementById('modal-content');
             window.openModal = (title, body) => { /* ... Modal open logic ... */
                 document.getElementById('modal-title').innerText = title;
                 document.getElementById('modal-body').innerHTML = body;
                 modal.classList.remove('pointer-events-none', 'hidden');
                 document.body.style.overflow = 'hidden';
                 setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95', 'opacity-0'); }, 10);
             };
             window.closeModal = () => { /* ... Modal close logic ... */
                 modal.classList.add('opacity-0');
                 modalContent.classList.add('scale-95', 'opacity-0');
                 document.body.style.overflow = '';
                 setTimeout(() => modal.classList.add('pointer-events-none', 'hidden'), 300);
             };
             modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

            // Click-to-Reveal Logic for Analyses
            window.toggleAnalysis = (company, lens) => {
                const contentDiv = document.getElementById(`${company}-${lens}-analysis`);
                const button = event.currentTarget; // Get the button that was clicked
                if (contentDiv) {
                    const isVisible = contentDiv.classList.contains('visible');
                    // Hide any other visible analysis for this company
                     const otherLens = lens === 'porter' ? 'mintzberg' : 'porter';
                     const otherContentDiv = document.getElementById(`${company}-${otherLens}-analysis`);
                     const otherButton = button.parentElement.querySelector(`button[onclick*="'${otherLens}'"]`); // Find the other button

                     if (otherContentDiv && otherContentDiv.classList.contains('visible')) {
                         otherContentDiv.classList.remove('visible');
                         otherContentDiv.style.maxHeight = '0';
                         if(otherButton) otherButton.classList.remove('bg-opacity-50'); // Reset other button style
                     }

                    // Toggle the clicked one
                    if (isVisible) {
                        contentDiv.classList.remove('visible');
                        contentDiv.style.maxHeight = '0';
                        button.classList.remove('bg-opacity-50'); // Reset button style
                    } else {
                        contentDiv.classList.add('visible');
                        contentDiv.style.maxHeight = contentDiv.scrollHeight + 'px';
                        button.classList.add('bg-opacity-50'); // Indicate active button
                    }
                }
            };


            // Workshop Logic (Blockbuster)
            const workshopResults = { /* ... Workshop results as before ... */
                'A': { title: 'Outcome: The Path of Operational Excellence', body: `<p class="mb-3">Focusing on your core strengths makes you the best rental chain in the world. However, you're perfecting a business model that is becoming obsolete. This is a classic <strong>Nokia</strong> mistake.</p><p class="mb-2"><strong class="text-blue-700">Porter's Lens:</strong> You've confused Operational Effectiveness with Strategy. Being the best at renting videos isn't a defensible position when the method of delivery (streaming) fundamentally changes the game.</p><p><strong class="text-teal-700">Mintzberg's Lens:</strong> Your deliberate strategy is too rigid. You've failed to learn from the 'weak signals' in the market and allow an emergent strategy (a pivot to digital) to form.</p>` },
                'B': { title: 'Outcome: The Cautious Hybrid', body: `<p class="mb-3">You own the disruptive technology, but your fear of cannibalizing store profits makes you slow and indecisive. This is a classic <strong>Kodak</strong> mistake.</p><p class="mb-2"><strong class="text-blue-700">Porter's Lens:</strong> You have failed to make a clear trade-off. By trying to be both a physical and digital company, you create a confusing strategy where your activities don't "fit" and work against each other. Another, more focused competitor will win.</p><p><strong class="text-teal-700">Mintzberg's Lens:</strong> You have an incredible opportunity for an emergent strategy, but the dominant logic of the old, deliberate strategy suppresses it. The organization cannot effectively "craft" a new future while clinging to its past.</p>` },
                'C': { title: 'Outcome: The Disruptor\'s Gambit', body: `<p class="mb-3">This is a risky and costly move. Your new division will directly compete with your stores, causing internal conflict. However, it's the only choice that embraces the future. You are choosing to disrupt yourself before someone else does.</p><p class="mb-2"><strong class="text-blue-700">Porter's Lens:</strong> You are making a clear trade-off and establishing a new, unique position in the emerging streaming market. Success will depend on creating a new system of activities (content licensing, server infrastructure) that "fit" this new position.</p><p><strong class="text-teal-700">Mintzberg's Lens:</strong> This approach creates the conditions for a new strategy to emerge. By separating the new venture, you allow it to learn and adapt without being crushed by the old way of doing things. It's a deliberate choice to enable emergence.</p>` }
            };
            window.showWorkshopResult = choice => openModal(workshopResults[choice].title, workshopResults[choice].body);

             // Workshop Logic (Digital News)
             const newsWorkshopResults = { /* ... News workshop results as before ... */
                'A': { title: 'Outcome: Print Fortress', body: `<p class="mb-3">Focusing solely on print excellence might retain loyal readers short-term, but ignores the massive shift to digital consumption. You risk becoming irrelevant like a company refusing to acknowledge the internet.</p><p class="mb-2"><strong class="text-blue-700">Porter's Lens:</strong> You're defending an existing position but failing to adapt to a fundamental change in industry structure (rise of digital substitutes, changing buyer power). Your 'fit' is becoming obsolete.</p><p><strong class="text-teal-700">Mintzberg's Lens:</strong> Your deliberate strategy is preventing learning. You're ignoring the emergent reality of online news consumption, failing to 'craft' a future-proof strategy.</p>` },
                'B': { title: 'Outcome: The Halfway House', body: `<p class="mb-3">This cautious approach avoids major disruption but likely satisfies neither print loyalists nor potential digital subscribers fully. You risk being 'stuck in the middle,' like <strong>Yahoo</strong> trying to be both media and tech.</p><p class="mb-2"><strong class="text-blue-700">Porter's Lens:</strong> Lack of clear trade-offs. You aren't fully committed to print or digital, leading to a weak, easily imitated position with poor 'fit' between activities.</p><p><strong class="text-teal-700">Mintzberg's Lens:</strong> You're acknowledging the emergent digital trend but aren't committing resources for it to truly take shape. The old deliberate strategy still dominates, hindering real adaptation.</p>` },
                'C': { title: 'Outcome: Digital First Leap', body: `<p class="mb-3">This is a bold, risky strategy requiring significant investment and potentially painful cannibalization of print revenue. However, it directly addresses the changing market and positions you for the future.</p><p class="mb-2"><strong class="text-blue-700">Porter's Lens:</strong> You are making a clear trade-off, choosing to compete in the new digital arena and build a new position with a corresponding set of activities (digital subscriptions, online ad sales, multimedia content).</p><p><strong class="text-teal-700">Mintzberg's Lens:</strong> You are deliberately creating space for a new strategy to emerge and be crafted. This requires organizational learning and adaptation to find a winning digital model.</p>` }
             };
            window.showNewsWorkshopResult = choice => openModal(newsWorkshopResults[choice].title, newsWorkshopResults[choice].body);

            // Quick Decision Logic (Trade-off)
            const tradeoffResults = { /* ... Tradeoff results as before ... */
                'A': { title: 'Outcome: Blurring the Lines', body: `<p class="mb-3">While seemingly customer-friendly, this moves away from your core low-cost position. Adding services increases complexity and costs, eroding your competitive advantage. Rivals who are better at service will still outperform you there.</p><p><strong class="text-blue-700">Porter's Lens:</strong> This violates the principle of trade-offs. Your unique position is low cost; adding 'full service' elements makes you less distinct and 'stuck in the middle'. It weakens the 'fit' of your low-cost activities.</p>` },
                'B': { title: 'Outcome: Strategic Discipline', body: `<p class="mb-3">Correct according to Porter. Strategy requires choosing what *not* to do. Offering free bags/snacks contradicts the low-cost model, which depends on minimizing extras. Maintaining this trade-off protects your unique position and the 'fit' among your activities (e.g., quick turnarounds, simple service).</p><p><strong class="text-blue-700">Porter's Lens:</strong> This demonstrates strong strategic discipline by reinforcing necessary trade-offs to maintain a clear, defensible low-cost leadership position.</p>` }
            };
            window.showTradeoffResult = choice => openModal(tradeoffResults[choice].title, tradeoffResults[choice].body);


            // Simulation Logic (Expanded)
            const simulationSteps = [ /* ... Simulation steps as before ... */
                 { id: 1, question: "Step 1: Where do you enter the market?", options: [{ text: "A) High-End Niche: Launch a luxury, high-performance EV sports car.", next: 2 }, { text: "B) Mass Market: Aim for volume with an affordable, practical EV.", next: 3 }] },
                 { id: 2, question: "You've established a premium brand. Now what? (Step 2)", options: [{ text: "A) Expand Downmarket: Use profits and brand cachet to develop a more affordable sedan.", next: 4 }, { text: "B) Stay High-End: Focus exclusively on the luxury market.", next: 5 }] },
                 { id: 3, question: "Mass market entry failed due to high costs & competition. You're bleeding cash. Now what? (Step 2)", options: [{ text: "A) Pivot Upmarket: Try to launch a luxury model to generate higher margins.", next: 6 }, { text: "B) Seek a Buyout: Your only hope is acquisition by a legacy automaker.", next: 7 }] },
                 { id: 4, question: "Your sedan is selling well, but demand outstrips supply. Production hell! How do you scale? (Step 3)", options: [{ text: "A) Rapid Automation: Build a highly automated 'alien dreadnought' factory for massive scale, quickly.", next: 8 }, { text: "B) Incremental Expansion: Gradually scale up existing lines, focusing on process improvement and quality control.", next: 9 }] },
                 { id: 5, isEnd: true, title: "STAGNATION: The Niche Player", analysis: "<p class='mb-2'>You survive as a boutique brand but never disrupt the industry.</p><p class='mb-1'><strong class='text-blue-700'>Porter's Lens:</strong> A sustainable position, but its scope is too narrow to be a major threat.</p><p><strong class='text-teal-700'>Mintzberg's Lens:</strong> You crafted a good initial strategy but stopped learning. Your pattern became repetitive.</p>" },
                 { id: 6, isEnd: true, title: "FAILURE: Brand Confusion", analysis: "<p class='mb-2'>Your brand is associated with 'cheap,' so a luxury pivot fails. You are 'stuck in the middle.' </p><p class='mb-1'><strong class='text-blue-700'>Porter's Lens:</strong> No clear position, contradictory activities, no sustainable advantage.</p><p><strong class='text-teal-700'>Mintzberg's Lens:</strong> A chaotic reaction, not an emergent strategy based on learning.</p>" },
                 { id: 7, isEnd: true, title: "FAILURE: The Inevitable End", analysis: "<p class='mb-2'>Your technology is acquired, but your company disappears. You become a footnote.</p><p><strong class='text-blue-700'>Porter's Lens:</strong> Lacking a viable position, you had no competitive advantage to sustain your independence.</p><p><strong class='text-teal-700'>Mintzberg's Lens:</strong> The organization failed to learn and adapt quickly enough to form a successful pattern of action.</p>" },
                 { id: 8, isEnd: true, title: "HIGH RISK/REWARD: Production Hell", analysis: "<p class='mb-2'>This mirrors Tesla's aggressive approach. Massive upfront investment and complexity lead to 'production hell' - delays, quality issues, and potential bankruptcy. If successful, achieves unparalleled scale, but the risk is enormous.</p><p class='mb-1'><strong class='text-blue-700'>Porter's Lens:</strong> A bold attempt to build insurmountable scale (a cost advantage component), but potentially sacrifices quality and consistency (differentiation components) short-term. High risk to 'fit'.</p><p><strong class='text-teal-700'>Mintzberg's Lens:</strong> A highly deliberate, top-down bet that prioritizes the grand vision over incremental learning. Limits emergent adaptation during the crucial scaling phase.</p>" },
                 { id: 9, isEnd: true, title: "SLOW & STEADY: Sustainable Growth", analysis: "<p class='mb-2'>This is a more traditional, less risky approach. Growth is slower, allowing focus on quality and process refinement. You avoid 'production hell' but might cede market share to faster-moving competitors.</p><p class='mb-1'><strong class='text-blue-700'>Porter's Lens:</strong> Maintains consistency and 'fit' better during scaling. Focuses on improving Operational Effectiveness within the established position, but might lack the scale needed for long-term cost leadership.</p><p><strong class='text-teal-700'>Mintzberg's Lens:</strong> Allows for more organizational learning and adaptation during scaling ('crafting' the production process). Less likely to face catastrophic failure but might miss the window for market dominance.</p>" }
            ];
            const simulationContainer = document.getElementById('simulation-container');
            const renderSimulationStep = (stepId) => {
                const step = simulationSteps.find(s => s.id === stepId);
                if (!step || !simulationContainer) return;
                if (step.isEnd) {
                    simulationContainer.innerHTML = `<div class="p-6 bg-rose-50 rounded-lg border border-rose-200"><h4 class="text-lg font-semibold text-rose-700 mb-3">${step.title}</h4><div class="prose-custom text-sm">${step.analysis}</div><button onclick="restartSimulation()" class="mt-4 px-4 py-1.5 bg-rose-600 text-white text-xs font-medium rounded-md hover:bg-rose-700 transition-colors focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2">Restart Simulation</button></div>`;
                } else {
                    simulationContainer.innerHTML = `<div class="p-6 bg-slate-100 rounded-lg border border-slate-200"><h4 class="text-base font-semibold text-slate-800 mb-4">${step.question}</h4><div class="grid sm:grid-cols-2 gap-4">${step.options.map(opt => `<button data-next="${opt.next}" class="activity-button simulation-button p-3 border-rose-200 bg-rose-50 hover:bg-rose-100 hover:border-rose-300 group focus:ring-rose-400"><strong class="group-hover:text-rose-800">${opt.text.split(':')[0]}:</strong> ${opt.text.split(':').slice(1).join(':').trim()}</button>`).join('')}</div></div>`;
                    document.querySelectorAll('.simulation-option').forEach(button => button.addEventListener('click', (e) => renderSimulationStep(parseInt(e.currentTarget.dataset.next))));
                }
            };
            window.restartSimulation = () => renderSimulationStep(1);
            if (simulationContainer) renderSimulationStep(1);

             // Quiz Logic
             const quizData = [ /* ... Quiz data as before ... */
                 { q: "What is the primary difference between Operational Effectiveness (OE) and Strategy, according to Porter?", o: ["OE is long-term, Strategy is short-term.", "OE is doing things better, Strategy is doing different things or things differently.", "Strategy is doing things better, OE is doing different things.", "They are interchangeable terms."], a: 1, e: "Porter is clear: Operational Effectiveness is about performing similar activities better than rivals. Strategy is not about being the best, but about being unique—performing different activities, or similar ones in a different way." },
                 { q: "Why was Kodak's failure a classic example of not making a 'trade-off'?", o: ["They didn't trade old managers for new ones.", "They were unwilling to sacrifice their profitable film business for a new, uncertain digital one.", "They didn't trade their US market focus for a global one."], a: 1, e: "A true strategic trade-off means choosing what NOT to do. Kodak tried to be both a film company and a digital company, which prevented them from committing fully to a winning digital strategy and creating 'fit' around it." },
                 { q: "According to Mintzberg, an 'emergent strategy' is one that:", o: ["Is planned meticulously from the start.", "Results from a pattern of actions that were not formally intended.", "Focuses only on emerging markets."], a: 1, e: "Mintzberg's core idea is that strategy often emerges 'from the ground up' as organizations learn and adapt. It's the realized pattern that was not explicitly intended by senior management." },
                 { q: "Nokia's primary strategic failure, from a Porterian view, was:", o: ["Confusing operational excellence in hardware with a sustainable strategy.", "Partnering with Microsoft.", "Having unattractive phone designs."], a: 0, e: "Nokia was the best in the world at making hardware efficiently (Operational Effectiveness). But this wasn't a defensible strategy when the basis of competition shifted to software ecosystems, where they had no unique position." },
                 { q: "Mintzberg's 'crafting' metaphor for strategy suggests the process is:", o: ["A detached, analytical process.", "A rigid, top-down planning exercise.", "A hands-on process where formulation and implementation are intertwined, like a potter shaping clay."], a: 2, e: "The 'crafting' image is central to Mintzberg's view. It emphasizes that strategy is not just about thinking; it's about a deep, involved process of learning-by-doing, where the 'crafter' adapts the design as they work with the material." },
                 { q: "Yahoo's downfall is best described by Porter's concept of being...", o: ["Too operationally effective.", "'Stuck in the middle' without a clear position or 'fit'.", "Having too many trade-offs."], a: 1, e: "Yahoo was neither a pure tech company nor a pure media company. It had no clear, unique position. Its various assets (Flickr, Tumblr, Mail) did not reinforce each other, demonstrating a total lack of 'fit'." },
                 { q: "The story of Honda succeeding with small motorcycles in the US, despite planning to sell large ones, is a classic example of:", o: ["A failed deliberate strategy.", "An emergent strategy.", "Poor operational effectiveness."], a: 1, e: "Honda's intended (deliberate) strategy failed, but a new, successful strategy emerged from the field as salespeople discovered an unexpected market for their small Super Cub bikes. This is a textbook Mintzberg example." },
                 { q: "A company trying to be the cheapest, highest quality, and best service provider simultaneously is violating which of Porter's key ideas?", o: ["Fit", "Trade-offs", "Operational Effectiveness"], a: 1, e: "Strategy is about choosing. Trying to be everything to everyone means you haven't made the hard choices (trade-offs) about what you will NOT do, which is essential to creating a unique and defensible position." },
                 { q: "In the 'Phoenix Motors' simulation, choosing 'Rapid Automation' (Step 3A) represents a strategy that prioritizes:", o: ["Incremental learning and adaptation.", "Maintaining operational consistency above all else.", "A deliberate, large-scale bet on achieving scale quickly, accepting high risk.", "Serving a niche market effectively."], a: 2, e: "Building a highly automated factory quickly is a massive, planned investment aimed at achieving scale advantages (a Porter concept), but it limits flexibility and learning (Mintzberg concerns) and carries significant execution risk, as Tesla experienced." },
                 { q: "What does 'fit' mean in Porter's framework?", o: ["How a company's activities interact and reinforce one another.", "Ensuring employees fit the company culture.", "Finding the right market for a product."], a: 0, e: "'Fit' is about synergy. It's when all a company's activities—from marketing to manufacturing to logistics—are interconnected and mutually reinforcing, making the strategy as a whole much harder to imitate than any single part." },
                 { q: "From a Mintzbergian perspective, Kodak's management...", o: ["Should have created a more detailed plan for digital.", "Allowed the deliberate strategy (film) to suppress the emergent strategy (digital).", "Didn't listen to their customers."], a: 1, e: "The invention of the digital camera was a potential emergent strategy from within. However, the powerful, established 'deliberate' strategy focused on protecting film sales, and the formal planning process actively killed this internal innovation." },
                 { q: "A company's 'realized strategy' (what it actually does), according to Mintzberg, is a blend of:", o: ["Its mission and vision statements.", "Its deliberate (planned) and emergent (unplanned) strategies.", "Its marketing and financial plans."], a: 1, e: "This is a key distinction. Mintzberg argues that no strategy is purely deliberate. The final 'realized' strategy is always a mix of what was intended and what emerged along the way through learning and adaptation." },
                 { q: "What was a common theme in the decline of all three giants (Nokia, Kodak, Yahoo)?", o: ["A lack of talented engineers.", "An inability to adapt business models to fundamental industry shifts.", "Insufficient funding for R&D."], a: 1, e: "This is the central lesson. All three were dominant in their respective eras but failed to adapt their strategies and core business models when technology and consumer behavior changed the rules of the game." },
                 { q: "Porter's framework is most useful for analyzing a company's...", o: ["Day-to-day operational details.", "Static position and competitive advantage at a point in time.", "Internal culture and politics."], a: 1, e: "Porter's tools (Five Forces, Value Chain, Positioning) are primarily analytical frameworks for understanding the structure of an industry and a firm's defensible position within it." },
                 { q: "If Porter provides the 'blueprint' for a strategy, Mintzberg explains the...", o: ["Importance of following the blueprint perfectly.", "Process of 'crafting' and learning that must happen during construction.", "Irrelevance of blueprints in the modern world."], a: 1, e: "This synthesizes the two views. Porter offers the analytical structure (the blueprint), while Mintzberg describes the dynamic, hands-on process of learning, adapting, and 'crafting' that brings any plan to life and allows it to evolve." }
            ];
            const quizContainer = document.getElementById('quiz-container');
            let score = 0;
            const scoreElement = document.getElementById('score');
            const totalQuestions = quizData.length;

            if (quizContainer) { /* ... Quiz population logic as before ... */
                 quizData.forEach((item, index) => {
                    const questionDiv = document.createElement('div');
                    questionDiv.className = 'border-t border-slate-300 pt-5 first:border-t-0';

                    const questionP = document.createElement('p');
                    questionP.className = 'text-sm font-semibold text-slate-800 mb-4';
                    questionP.textContent = `${index + 1}. ${item.q}`;
                    questionDiv.appendChild(questionP);

                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'space-y-2';
                    optionsDiv.id = `q${index + 1}-options`;

                    item.o.forEach((optionText, optionIndex) => {
                        const optionButton = document.createElement('button');
                        optionButton.type = 'button';
                        optionButton.className = 'quiz-option block w-full text-left p-2.5 border border-slate-300 rounded-md bg-white hover:bg-slate-50 hover:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400 focus:ring-opacity-50 text-xs';
                        optionButton.textContent = optionText;
                        optionButton.onclick = () => {
                            const parent = document.getElementById(`q${index + 1}-options`);
                            const explanation = optionButton.parentElement.nextElementSibling;

                            Array.from(parent.children).forEach(child => {
                                child.disabled = true;
                                child.classList.remove('hover:bg-slate-50', 'hover:border-blue-400');
                            });

                            if (optionIndex === item.a) {
                                optionButton.classList.add('correct');
                                score++;
                                scoreElement.textContent = `${score} / ${totalQuestions}`;
                            } else {
                                optionButton.classList.add('incorrect');
                                if (parent.children[item.a]) {
                                    parent.children[item.a].classList.add('correct');
                                }
                            }

                            explanation.classList.add('visible');
                            explanation.style.maxHeight = explanation.scrollHeight + 'px';
                        };
                        optionsDiv.appendChild(optionButton);
                    });

                    const explanationP = document.createElement('p');
                    explanationP.className = 'quiz-explanation text-xs text-slate-600 bg-slate-100 p-3 rounded-md border border-slate-200';
                    explanationP.innerHTML = `<strong class='text-slate-700'>Explanation:</strong> ${item.e}`;

                    questionDiv.appendChild(optionsDiv);
                    questionDiv.appendChild(explanationP);
                    quizContainer.appendChild(questionDiv);
                });
                scoreElement.textContent = `${score} / ${totalQuestions}`;
             }

            // Navigation & Sticky Header Logic
             const navLinks = document.querySelectorAll('.nav-link');
             const sectionElements = document.querySelectorAll('main section[id]');
             const mobileNav = document.getElementById('mobile-nav');
             const header = document.getElementById('main-header');
             const topBar = document.getElementById('top-bar');
             let totalStickyHeight = 0;

             function calculateStickyHeight() { /* ... Calculate height logic as before ... */
                 const topBarHeight = topBar && window.getComputedStyle(topBar).display !== 'none' ? topBar.offsetHeight : 0;
                 const headerHeight = header ? header.offsetHeight : 0;
                 totalStickyHeight = topBarHeight + headerHeight;
                 if(header) {
                      header.style.top = topBarHeight > 0 ? `${topBarHeight}px` : '0px';
                 }
                  document.documentElement.style.setProperty('--sticky-offset', `${totalStickyHeight + 1}px`);
             }
              calculateStickyHeight();
              window.addEventListener('resize', calculateStickyHeight);

             // Throttled scroll listener
             let scrollTimeout;
             window.addEventListener('scroll', () => {
                 if (!scrollTimeout) {
                    scrollTimeout = setTimeout(() => { /* ... Scroll listener logic as before ... */
                        calculateStickyHeight(); // Recalculate height

                        let currentScroll = window.scrollY;
                        let activeSectionId = '';
                        let minDistanceToTop = Infinity; // Use this to find the section closest to the top edge

                        sectionElements.forEach(section => {
                            const sectionTop = section.offsetTop;
                            const distance = sectionTop - (currentScroll + totalStickyHeight); // Distance from bottom of sticky headers

                             // If the section top is above or very near the bottom of sticky headers
                            if (distance <= 40) { // Using a 40px buffer
                                 // Check if it's closer than the current best candidate below the headers
                                 // Or if it's the section currently occupying the space just below the header
                                if (Math.abs(distance) < minDistanceToTop || section.id === activeSectionId) {
                                    minDistanceToTop = Math.abs(distance);
                                    activeSectionId = section.id;
                                }
                            }
                        });


                        // Edge cases
                        if (currentScroll < 50 && sectionElements.length > 0) activeSectionId = sectionElements[0].id;
                        else if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50 && sectionElements.length > 0) activeSectionId = sectionElements[sectionElements.length - 1].id;
                        else if (!activeSectionId && sectionElements.length > 0) {
                            // Find last section whose top is above current view + offset
                              for (let i = sectionElements.length - 1; i >= 0; i--) {
                                if (sectionElements[i].offsetTop <= currentScroll + totalStickyHeight + 40) {
                                    activeSectionId = sectionElements[i].id;
                                    break;
                                }
                             }
                             if (!activeSectionId) activeSectionId = sectionElements[0].id; // Ultimate fallback
                        }

                        // Apply grouping logic for display/highlighting
                        let displayId = activeSectionId;
                         const activeElement = document.getElementById(activeSectionId);
                          if (activeElement) {
                             const casesSection = activeElement.closest('section#cases');
                             const activitiesSection = activeElement.closest('section#activities');
                             const positioningSection = activeElement.closest('section#positioning-examples');
                              const fitSection = activeElement.closest('section#fit-examples');

                             if (casesSection) displayId = 'cases';
                             else if (activitiesSection) displayId = 'activities';
                             else if (positioningSection) displayId = 'positioning-examples';
                             else if (fitSection) displayId = 'fit-examples';
                         }


                        // Update desktop nav links
                        navLinks.forEach(link => { /* ... Update desktop links ... */
                            link.classList.remove('active-nav');
                            const linkHrefId = link.getAttribute('href').substring(1);
                            if (linkHrefId === displayId) {
                                link.classList.add('active-nav');
                            }
                         });

                        // Update mobile dropdown
                        const targetOptionValue = `#${displayId}`; /* ... Update mobile dropdown ... */
                         if (mobileNav.value !== targetOptionValue) {
                            const optionExists = Array.from(mobileNav.options).some(option => option.value === targetOptionValue);
                            if (optionExists) {
                                mobileNav.value = targetOptionValue;
                            }
                         }

                        scrollTimeout = null;
                    }, 50); // Throttle delay
                 }
             }, { passive: true });

            // Mobile nav scroll action
            mobileNav.addEventListener('change', () => { /* ... Mobile scroll logic as before ... */
                const targetId = mobileNav.value;
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    requestAnimationFrame(() => {
                        calculateStickyHeight();
                        const targetPosition = targetElement.offsetTop - totalStickyHeight;
                        window.scrollTo({ top: targetPosition, behavior: 'smooth' });
                    });
                }
            });

            // Desktop nav scroll action
            navLinks.forEach(link => { /* ... Desktop scroll logic as before ... */
                link.addEventListener('click', function(e) {
                    const targetId = this.getAttribute('href');
                    if (targetId.startsWith('#')) {
                        e.preventDefault();
                        const targetElement = document.querySelector(targetId);
                        if (targetElement) {
                             requestAnimationFrame(() => {
                                calculateStickyHeight();
                                const targetPosition = targetElement.offsetTop - totalStickyHeight;
                                window.scrollTo({ top: targetPosition, behavior: 'smooth' });
                             });
                        }
                    }
                });
            });

             // Initial calculation & scroll trigger
             calculateStickyHeight();
             window.dispatchEvent(new Event('scroll'));

        });
    </script>
</body>
