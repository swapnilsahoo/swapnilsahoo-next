</head><body class="antialiased selection:bg-green-100 selection:text-green-900">  <div id="root"></div>
  <script type="text/babel">    const { useState, useEffect } = React;
    const sections = [      { id: "intro", label: "Introduction" },      { id: "what", label: "What is AI?" },      { id: "landscape", label: "AI Landscape" },      { id: "business", label: "Business Impact" },      { id: "teaching", label: "Teaching with AI" },      { id: "tools", label: "Tools" },      { id: "ethics", label: "Ethics" },      { id: "future", label: "The Road Ahead" },    ];
    const bodyStyle = {      fontSize: "1rem", lineHeight: 1.85, color: "#475569",      fontFamily: "'Satoshi', sans-serif", marginBottom: "1.5rem",    };
    function ChapterHeader({ number, title, subtitle }) {      return (        <div style={{ marginBottom: "3rem" }}>          <div style={{ color: "rgba(21,128,61,0.8)", fontSize: "0.7rem", fontFamily: "sans-serif", letterSpacing: "0.3em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>            Chapter {number}          </div>          <h2 style={{ fontSize: "clamp(2rem, 3.5vw, 2.8rem)", fontWeight: "normal", color: "#1a1a1a", marginBottom: "0.5rem", lineHeight: 1.2, fontFamily: "'Playfair Display', serif" }}>{title}</h2>          <p style={{ color: "#64748b", fontSize: "1rem", fontFamily: "sans-serif", fontStyle: "italic", margin: 0 }}>{subtitle}</p>          <div style={{ width: "60px", height: "2px", background: "#15803d", marginTop: "1.5rem" }} />        </div>      );    }
    function ConceptCard({ title, items }) {      return (        <div style={{ border: "1px solid #e2e8f0", backgroundColor: "#ffffff", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)", borderRadius: "1rem", overflow: "hidden" }}>          <div style={{ background: "rgba(21,128,61,0.05)", padding: "1rem 1.5rem", borderBottom: "1px solid #e2e8f0" }}>            <div style={{ color: "#15803d", fontSize: "0.78rem", fontFamily: "sans-serif", letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: "bold" }}>{title}</div>          </div>          {items.map(({ label, desc, color }, i) => (            <div key={label} style={{ padding: "1rem 1.5rem", borderBottom: i < items.length - 1 ? "1px solid #e2e8f0" : "none", display: "flex", alignItems: "center", gap: "1rem" }}>              <div style={{ width: "8px", height: "8px", borderRadius: "50%", background: color, flexShrink: 0 }} />              <div>                <div style={{ color: "#1a1a1a", fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "600" }}>{label}</div>                <div style={{ color: "#475569", fontSize: "0.75rem", fontFamily: "sans-serif", marginTop: "0.2rem" }}>{desc}</div>              </div>            </div>          ))}        </div>      );    }

    /* ── COMPONENT: 4-WEEK SYLLABUS MODULE ── */
    function AISyllabusModule() {
      return (
        <div style={{ marginTop: "6rem", borderTop: "1px solid #e2e8f0", paddingTop: "4rem" }}>
          <div style={{ color: "rgba(21,128,61,0.8)", fontSize: "0.7rem", fontFamily: "sans-serif", letterSpacing: "0.3em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>Teaching sequence</div>
          <h3 style={{ fontSize: "2.2rem", color: "#1a1a1a", marginBottom: "1.5rem", fontWeight: "bold", lineHeight: 1.2, fontFamily: "'Playfair Display', serif" }}>A four-week foundation</h3>
          <p style={{ ...bodyStyle, maxWidth: "900px" }}>The course begins with the mechanics of data and machine learning, then moves into project choices, organisational adoption and social consequences. Each week gives managers enough technical grounding to ask better strategic questions without pretending that every learner must become an engineer.</p>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "2rem", marginTop: "3rem", marginBottom: "4rem" }}>
            
            {/* Week 1 */}
            <div style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: "12px", padding: "2rem", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)", position: "relative", overflow: "hidden" }}>
              <div style={{ position: "absolute", top: 0, left: 0, width: "4px", height: "100%", background: "#15803d" }}></div>
              <h4 style={{ color: "#15803d", fontSize: "1.3rem", fontWeight: "bold", marginBottom: "1rem", fontFamily: "'Playfair Display', serif" }}>Week 1: What is AI</h4>
              <ul style={{ listStyleType: "none", padding: 0, color: "#475569", fontSize: "0.85rem", lineHeight: 1.8, fontFamily: "sans-serif", margin: 0 }}>
                <li><strong style={{color:"#15803d", marginRight: "8px"}}>›</strong>Introduction</li>
                <li><strong style={{color:"#15803d", marginRight: "8px"}}>›</strong>Machine Learning</li>
                <li><strong style={{color:"#15803d", marginRight: "8px"}}>›</strong>What is data</li>
                <li><strong style={{color:"#15803d", marginRight: "8px"}}>›</strong>The terminology of AI</li>
                <li><strong style={{color:"#15803d", marginRight: "8px"}}>›</strong>What makes an AI company?</li>
                <li><strong style={{color:"#15803d", marginRight: "8px"}}>›</strong>What Machine Learning can and cannot do</li>
                <li><strong style={{color:"#15803d", marginRight: "8px"}}>›</strong>Intuitive explanation of deep learning</li>
              </ul>
            </div>

            {/* Week 2 */}
            <div style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: "12px", padding: "2rem", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)", position: "relative", overflow: "hidden" }}>
              <div style={{ position: "absolute", top: 0, left: 0, width: "4px", height: "100%", background: "#3b82f6" }}></div>
              <h4 style={{ color: "#1d4ed8", fontSize: "1.3rem", fontWeight: "bold", marginBottom: "1rem", fontFamily: "'Playfair Display', serif" }}>Week 2: Building AI Projects</h4>
              <ul style={{ listStyleType: "none", padding: 0, color: "#475569", fontSize: "0.85rem", lineHeight: 1.8, fontFamily: "sans-serif", margin: 0 }}>
                <li><strong style={{color:"#3b82f6", marginRight: "8px"}}>›</strong>Workflow of a Machine Learning project</li>
                <li><strong style={{color:"#3b82f6", marginRight: "8px"}}>›</strong>Workflow of a Data Science project</li>
                <li><strong style={{color:"#3b82f6", marginRight: "8px"}}>›</strong>Every job function needs to learn to use data</li>
                <li><strong style={{color:"#3b82f6", marginRight: "8px"}}>›</strong>How to choose an AI project</li>
                <li><strong style={{color:"#3b82f6", marginRight: "8px"}}>›</strong>Working with an AI team</li>
                <li><strong style={{color:"#3b82f6", marginRight: "8px"}}>›</strong>Technical tools for AI teams</li>
              </ul>
            </div>

            {/* Week 3 */}
            <div style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: "12px", padding: "2rem", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)", position: "relative", overflow: "hidden" }}>
              <div style={{ position: "absolute", top: 0, left: 0, width: "4px", height: "100%", background: "#f59e0b" }}></div>
              <h4 style={{ color: "#b45309", fontSize: "1.3rem", fontWeight: "bold", marginBottom: "1rem", fontFamily: "'Playfair Display', serif" }}>Week 3: AI in Your Company</h4>
              <ul style={{ listStyleType: "none", padding: 0, color: "#475569", fontSize: "0.85rem", lineHeight: 1.8, fontFamily: "sans-serif", margin: 0 }}>
                <li><strong style={{color:"#f59e0b", marginRight: "8px"}}>›</strong>Case study: Smart speaker</li>
                <li><strong style={{color:"#f59e0b", marginRight: "8px"}}>›</strong>Case study: Self-driving car</li>
                <li><strong style={{color:"#f59e0b", marginRight: "8px"}}>›</strong>Example roles of an AI team</li>
                <li><strong style={{color:"#f59e0b", marginRight: "8px"}}>›</strong>AI Transformation Playbook</li>
                <li><strong style={{color:"#f59e0b", marginRight: "8px"}}>›</strong>AI pitfalls to avoid</li>
                <li><strong style={{color:"#f59e0b", marginRight: "8px"}}>›</strong>Taking your first step in AI</li>
                <li><strong style={{color:"#f59e0b", marginRight: "8px"}}>›</strong>Survey of major AI applications</li>
                <li><strong style={{color:"#f59e0b", marginRight: "8px"}}>›</strong>Survey of major AI techniques</li>
              </ul>
            </div>

            {/* Week 4 */}
            <div style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: "12px", padding: "2rem", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)", position: "relative", overflow: "hidden" }}>
              <div style={{ position: "absolute", top: 0, left: 0, width: "4px", height: "100%", background: "#8b5cf6" }}></div>
              <h4 style={{ color: "#6d28d9", fontSize: "1.3rem", fontWeight: "bold", marginBottom: "1rem", fontFamily: "'Playfair Display', serif" }}>Week 4: AI and Society</h4>
              <ul style={{ listStyleType: "none", padding: 0, color: "#475569", fontSize: "0.85rem", lineHeight: 1.8, fontFamily: "sans-serif", margin: 0 }}>
                <li><strong style={{color:"#8b5cf6", marginRight: "8px"}}>›</strong>A realistic view of AI</li>
                <li><strong style={{color:"#8b5cf6", marginRight: "8px"}}>›</strong>Discrimination / Bias</li>
                <li><strong style={{color:"#8b5cf6", marginRight: "8px"}}>›</strong>Adversarial attacks</li>
                <li><strong style={{color:"#8b5cf6", marginRight: "8px"}}>›</strong>Adverse uses</li>
                <li><strong style={{color:"#8b5cf6", marginRight: "8px"}}>›</strong>AI and developing nations</li>
                <li><strong style={{color:"#8b5cf6", marginRight: "8px"}}>›</strong>AI and jobs</li>
                <li><strong style={{color:"#8b5cf6", marginRight: "8px"}}>›</strong>Conclusion</li>
              </ul>
            </div>

          </div>
        </div>
      );
    }

    /* ── COMPONENT: MCKINSEY REPORT SIMULATION ── */
    function McKinseySim() {
      return (
        <div style={{ marginTop: "6rem", borderTop: "1px solid #e2e8f0", paddingTop: "4rem" }}>
          <div style={{ color: "rgba(21,128,61,0.8)", fontSize: "0.7rem", fontFamily: "sans-serif", letterSpacing: "0.3em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>Empirical Baseline</div>
          <h3 style={{ fontSize: "2.2rem", color: "#1a1a1a", marginBottom: "1.5rem", fontWeight: "bold", lineHeight: 1.2, fontFamily: "'Playfair Display', serif" }}>The Economic Potential of AI</h3>
          <p style={{ ...bodyStyle, maxWidth: "900px" }}>I submit to you the fundamental economic reality. McKinsey projects <strong>$13-22 Trillion</strong> in annual value creation by 2033 (incorporating $3-4 Trillion specifically from Generative AI). Crucially, notice the distribution. The vast majority of this value lies <em>outside</em> the software industry. It resides in the physical and service economies.</p>

          <div style={{ padding: "1.5rem", background: "rgba(21,128,61,0.05)", borderLeft: "4px solid #15803d", marginBottom: "3rem", fontFamily: "sans-serif", fontSize: "0.75rem", color: "#475569", lineHeight: 1.6, borderRadius: "0 8px 8px 0" }}>
            <strong>Reference:</strong><br />
            Chui, M., Hazan, E., Roberts, R., Singla, A., Smaje, K., Sukharevsky, A., Yee, L., & Zemmel, R. (2023, June). <em>The economic potential of generative AI: The next productivity frontier</em>. McKinsey & Company. <a href="https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/the-economic-potential-of-generative-ai-the-next-productivity-frontier" target="_blank" style={{ color: "#15803d", textDecoration: "underline", fontWeight: "bold" }} rel="noopener noreferrer">Link</a>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: "1.2rem", maxWidth: "800px", background: "#ffffff", padding: "2rem", border: "1px solid #e2e8f0", borderRadius: "12px", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)", marginBottom: "4rem" }}>
            {[
              { label: "Retail", val: "$0.8T ($800B)", pct: "100%", color: "#1e3a8a" },
              { label: "Travel", val: "$480B", pct: "60%", color: "#1d4ed8" },
              { label: "Transport & Logistics", val: "$475B", pct: "59%", color: "#2563eb" },
              { label: "Automotive & Assembly", val: "$405B", pct: "50%", color: "#3b82f6" },
              { label: "Basic Materials", val: "$300B", pct: "37%", color: "#60a5fa" }
            ].map(item => (
              <div key={item.label}>
                <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "sans-serif", fontSize: "0.85rem", color: "#1a1a1a", marginBottom: "0.4rem", fontWeight: "600" }}>
                  <span>{item.label}</span>
                  <span style={{ color: item.color, fontWeight: "bold" }}>{item.val}</span>
                </div>
                <div style={{ width: "100%", background: "#f1f5f9", height: "10px", borderRadius: "5px" }}>
                  <div style={{ width: item.pct, background: item.color, height: "10px", borderRadius: "5px" }}></div>
                </div>
              </div>
            ))}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "1rem", marginTop: "1.5rem", paddingTop: "1.5rem", borderTop: "1px solid #e2e8f0", fontFamily: "sans-serif", fontSize: "0.8rem", color: "#64748b" }}>
              <div>Adv. Electronics: <strong style={{ color: "#1a1a1a" }}>$291B</strong></div>
              <div>Healthcare: <strong style={{ color: "#1a1a1a" }}>$267B</strong></div>
              <div>High Tech: <strong style={{ color: "#1a1a1a" }}>$267B</strong></div>
              <div>Telecom: <strong style={{ color: "#1a1a1a" }}>$174B</strong></div>
              <div>Oil & Gas: <strong style={{ color: "#1a1a1a" }}>$173B</strong></div>
              <div>Agriculture: <strong style={{ color: "#1a1a1a" }}>$164B</strong></div>
            </div>
          </div>

          <div style={{ color: "rgba(21,128,61,0.8)", fontSize: "0.7rem", fontFamily: "sans-serif", letterSpacing: "0.3em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>Reading the evidence</div>
          <h3 style={{ fontSize: "2.2rem", color: "#1a1a1a", marginBottom: "1.5rem", fontWeight: "bold", lineHeight: 1.2, fontFamily: "'Playfair Display', serif" }}>Where projected value is concentrated</h3>
          <p style={{ ...bodyStyle, maxWidth: "900px" }}>This exercise turns estimates from the cited McKinsey report into questions a management team can debate. The figures are projections, not promises. Use them to compare where generative AI may change tasks, costs and decisions—and where the assumptions deserve scrutiny.</p>

          {/* 75% Concentration */}
          <div style={{ marginBottom: "4rem", marginTop: "3rem" }}>
            <h4 style={{ color: "#15803d", fontSize: "1.1rem", marginBottom: "1rem", fontFamily: "'Playfair Display', serif", fontWeight: "bold" }}>I. Four functions in the foreground</h4>
            <p style={{ ...bodyStyle, fontSize: "0.95rem", marginBottom: "1.5rem" }}>The report places roughly three-quarters of its projected $2.6–$4.4 trillion range in four functions. That concentration is a useful starting point for inquiry, but an investment decision still depends on the organisation’s data, workflow and risk.</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "1rem" }}>
              {[
                { title: "Customer Operations", icon: "🎧", desc: "Answer routine questions, help agents find information and draft responses." },
                { title: "Marketing & Sales", icon: "📈", desc: "Draft and adapt content, summarise customer signals and support lead research." },
                { title: "Software Engineering", icon: "💻", desc: "Suggest code, explain unfamiliar systems and help diagnose faults." },
                { title: "Product R&D", icon: "🔬", desc: "Compare design options, search technical knowledge and speed early experiments." }
              ].map(card => (
                <div key={card.title} style={{ background: "#ffffff", padding: "1.5rem", borderRadius: "8px", border: "1px solid #e2e8f0", boxShadow: "0 2px 4px rgba(0,0,0,0.02)" }}>
                  <div style={{ fontSize: "2rem", marginBottom: "1rem" }}>{card.icon}</div>
                  <h5 style={{ fontWeight: "bold", fontSize: "0.9rem", color: "#1a1a1a", marginBottom: "0.5rem", fontFamily: "sans-serif" }}>{card.title}</h5>
                  <p style={{ fontSize: "0.75rem", color: "#64748b", fontFamily: "sans-serif", lineHeight: 1.5 }}>{card.desc}</p>
                </div>
              ))}
            </div>
          </div>

          {/* Timeline Acceleration */}
          <div style={{ marginBottom: "4rem" }}>
            <h4 style={{ color: "#15803d", fontSize: "1.1rem", marginBottom: "1rem", fontFamily: "'Playfair Display', serif", fontWeight: "bold" }}>II. The Timeline Acceleration</h4>
            <p style={{ ...bodyStyle, fontSize: "0.95rem", marginBottom: "1.5rem" }}>McKinsey’s earlier midpoint estimate placed automation of half of current work activities around 2053. Its generative-AI scenario moved that midpoint roughly a decade earlier. Treat the dates as modelled scenarios rather than a timetable.</p>
            <div style={{ background: "#f8fafc", padding: "2rem", borderRadius: "12px", border: "1px solid #e2e8f0" }}>
              <div style={{ marginBottom: "2rem" }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "sans-serif", fontSize: "0.85rem", fontWeight: "bold", color: "#64748b", marginBottom: "0.5rem" }}>
                  <span>Pre-Generative AI Estimate (50% Automation)</span>
                  <span>Midpoint: 2053</span>
                </div>
                <div style={{ width: "100%", background: "#e2e8f0", height: "12px", borderRadius: "6px", position: "relative" }}>
                  <div style={{ width: "75%", background: "#94a3b8", height: "12px", borderRadius: "6px" }}></div>
                  <div style={{ position: "absolute", left: "75%", top: "-4px", height: "20px", width: "2px", background: "#1a1a1a" }}></div>
                </div>
              </div>
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "sans-serif", fontSize: "0.85rem", fontWeight: "bold", color: "#15803d", marginBottom: "0.5rem" }}>
                  <span>Post-Generative AI Estimate (50% Automation)</span>
                  <span style={{ background: "#15803d", color: "#fff", padding: "2px 8px", borderRadius: "4px" }}>Midpoint: 2045</span>
                </div>
                <div style={{ width: "100%", background: "#e2e8f0", height: "12px", borderRadius: "6px", position: "relative" }}>
                  <div style={{ width: "50%", background: "#22c55e", height: "12px", borderRadius: "6px" }}></div>
                  <div style={{ position: "absolute", left: "50%", top: "-4px", height: "20px", width: "2px", background: "#15803d" }}></div>
                  <div style={{ position: "absolute", left: "55%", top: "-25px", fontSize: "0.75rem", color: "#dc2626", fontWeight: "bold", fontStyle: "italic" }}>← Accelerated by a decade</div>
                </div>
              </div>
            </div>
          </div>

          {/* Educational Inversion */}
          <div>
            <h4 style={{ color: "#15803d", fontSize: "1.1rem", marginBottom: "1rem", fontFamily: "'Playfair Display', serif", fontWeight: "bold" }}>III. The Educational Inversion (Skill-Bias Shift)</h4>
            <p style={{ ...bodyStyle, fontSize: "0.95rem", marginBottom: "1.5rem" }}>Previous technological revolutions hollowed out middle-income, physical labor. Generative AI does the exact opposite. It targets cognitive labor. Notice how the highest academic degrees now face the highest incremental exposure to automation.</p>
            <div style={{ background: "#ffffff", padding: "2rem", borderRadius: "12px", border: "1px solid #e2e8f0", boxShadow: "0 2px 4px rgba(0,0,0,0.02)" }}>
              {[
                { level: "High School Diploma", base: 51, genai: 13, total: 64 },
                { level: "Bachelor's Degree", base: 36, genai: 24, total: 60 },
                { level: "Master's / PhD", base: 28, genai: 29, total: 57 }
              ].map(edu => (
                <div key={edu.level} style={{ marginBottom: "1.5rem", display: "flex", alignItems: "center", gap: "1rem" }}>
                  <span style={{ width: "160px", fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "bold", color: "#1a1a1a" }}>{edu.level}</span>
                  <div style={{ flex: 1, display: "flex", height: "24px", borderRadius: "4px", overflow: "hidden", background: "#f1f5f9" }}>
                    <div style={{ width: `${edu.base}%`, background: "#94a3b8", display: "flex", alignItems: "center", paddingLeft: "8px", fontSize: "0.7rem", color: "#fff", fontWeight: "bold" }}>{edu.base}% (Base)</div>

    /* ── COMPONENT: AI COMPANY TRANSFORMATION (ANDREW NG) ── */
    function AICompanyTransformation() {

        <div style={{ marginTop: "6rem", borderTop: "1px solid #e2e8f0", paddingTop: "4rem" }}>
          <div style={{ color: "rgba(21,128,61,0.8)", fontSize: "0.7rem", fontFamily: "sans-serif", letterSpacing: "0.3em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>Organizational Sociology</div>
          <h3 style={{ fontSize: "2.2rem", color: "#1a1a1a", marginBottom: "1.5rem", fontWeight: "normal", lineHeight: 1.2, fontFamily: "'Playfair Display', serif" }}>What Makes an AI Company?</h3>
          <p style={{ ...bodyStyle, maxWidth: "900px" }}>Adding a model to an old workflow does not, by itself, change how a company learns. Andrew Ng makes the comparison with the early internet: putting a catalogue online was different from building short feedback cycles, experiments and decision rights around digital behaviour. The same distinction helps us examine claims that a company has become “AI-driven.”</p>

          <h3 style={{ fontSize: "2.2rem", color: "#1a1a1a", marginBottom: "1.5rem", fontWeight: "normal", lineHeight: 1.2, fontFamily: "'Playfair Display', serif" }}>The Mechanics of Machine Learning</h3>
          <p style={{ ...bodyStyle, maxWidth: "900px" }}>I submit to you the foundational economic engine driving modern AI: <strong>Supervised Learning</strong>. It is not magic; it is the rigorous mathematical mapping of Input (A) to Output (B). As an academic researcher, I observe executives consistently mischaracterize this mechanism. Observe the empirical reality.</p>

          {/* Generative AI LLM Concept */}
          <div style={{ marginTop: "4rem", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4rem", alignItems: "center" }}>
            <div>
              <h4 style={{ color: "#15803d", fontSize: "1.1rem", marginBottom: "1rem", fontFamily: "'Playfair Display', serif", fontWeight: "bold" }}>The Generative Illusion</h4>
              <p style={{ ...bodyStyle, fontSize: "0.95rem" }}>Large language models can produce remarkably fluent responses without being sentient. During pre-training, a central objective is to predict the next token from patterns learned across large text collections.</p>

              <div style={{ marginBottom: "0.8rem" }}>[A] "My favorite drink" <br/><span style={{color:"#15803d", fontWeight: "bold"}}>➔ [B] "is"</span></div>
              <div style={{ marginBottom: "0.8rem" }}>[A] "My favorite drink is" <br/><span style={{color:"#15803d", fontWeight: "bold"}}>➔ [B] "lychee"</span></div>
              <div style={{ marginBottom: "0.8rem" }}>[A] "My favorite drink is lychee" <br/><span style={{color:"#15803d", fontWeight: "bold"}}>➔ [B] "bubble"</span></div>
              <div>[A] "My favorite drink is lychee bubble" <br/><span style={{color:"#15803d", fontWeight: "bold"}}>➔ [B] "tea"</span></div>
            </div>
          </div>

          {/* Transformer & Emergence (3Blue1Brown) */}

            <div style={{ position: "absolute", top: 0, right: 0, width: "300px", height: "300px", background: "#3b82f6", borderRadius: "50%", filter: "blur(80px)", opacity: 0.2, transform: "translate(30%, -30%)" }}></div>

            <p style={{ fontSize: "0.95rem", color: "#cbd5e1", lineHeight: 1.6, marginBottom: "2rem", position: "relative", zIndex: 10 }}>Before 2017, widely used language models processed text in sequence. The transformer architecture changed that design by letting a model weigh relationships across a passage in parallel.</p>
            
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "2rem", position: "relative", zIndex: 10 }}>
              <div>

                <p style={{ fontSize: "0.85rem", color: "#94a3b8", lineHeight: 1.5 }}>Transformers do not read left-to-right. They soak the entire text in at once, in parallel. Words are stripped into vectors (lists of numbers). The <strong>Attention Mechanism</strong> allows these isolated lists to "talk" to one another to negotiate context. Is "bank" a river, or JPMorgan? The numbers socialize to decide.</p>

            <p style={{ ...bodyStyle, maxWidth: "800px", fontSize: "0.95rem" }}>Traditional AI algorithms plateau. They cannot extract additional performance from massive data. Deep learning neural networks, conversely, scale almost indefinitely. This is why computational hardware (GPUs) and Big Data constitute the ultimate economic moats.</p>

      function NLPSim() {
        const [text, setText] = useState("Detecting multiple detections detected by the detector.");
        const stem = (word) => word.toLowerCase().replace(/ing$|ed$|ions$|ion$|ors$|or$|s$/g, '');
        const stopWords = ['the', 'by', 'a', 'an', 'is', 'are'];
        const tokens = text.split(/\s+/).filter(w => w.length > 0);
        const noStopWords = tokens.filter(w => !stopWords.includes(w.toLowerCase()));
        const stemmed = noStopWords.map(stem);

        return (
          <div style={{ background: "#ffffff", padding: "2rem", borderRadius: "1rem", border: "1px solid #e2e8f0", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)" }}>
            <h4 style={{ color: "#15803d", fontSize: "1.2rem", marginBottom: "1rem", fontWeight: "bold", fontFamily: "'Playfair Display', serif" }}>4. Natural Language Processing Pipeline</h4>
            <p style={{ fontSize: "0.9rem", color: "#475569", lineHeight: 1.6, marginBottom: "1.5rem", fontFamily: "sans-serif" }}>Text mining and NLP extract useful insights from unstructured text. Observe how raw text is broken down (Tokenization), filtered (Stop-word Removal), and reduced to its root morphological form (Stemming).</p>

            <input 
              type="text" 
              value={text} 
              onChange={e=>setText(e.target.value)} 
              style={{ width: "100%", padding: "1rem", fontSize: "1rem", border: "1px solid #cbd5e1", borderRadius: "8px", marginBottom: "2rem", fontFamily: "sans-serif", outline: "none" }}
            />

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "1rem" }}>
              <div style={{ background: "#f8fafc", padding: "1rem", border: "1px solid #e2e8f0", borderRadius: "8px" }}>
                <strong style={{ display: "block", color: "#1e293b", marginBottom: "0.5rem", fontSize: "0.9rem" }}>1. Tokenization</strong>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "0.5rem" }}>
                  {tokens.map((t, i) => <span key={i} style={{ background: "#e2e8f0", padding: "2px 6px", borderRadius: "4px", fontSize: "0.8rem", color: "#334155" }}>{t}</span>)}
                </div>
              </div>

              <div style={{ background: "#f8fafc", padding: "1rem", border: "1px solid #e2e8f0", borderRadius: "8px" }}>
                <strong style={{ display: "block", color: "#1e293b", marginBottom: "0.5rem", fontSize: "0.9rem" }}>2. Stop-word Removal</strong>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "0.5rem" }}>
                  {noStopWords.map((t, i) => <span key={i} style={{ background: "#e0e7ff", padding: "2px 6px", borderRadius: "4px", fontSize: "0.8rem", color: "#1e40af" }}>{t}</span>)}
                </div>
              </div>

              <div style={{ background: "#f8fafc", padding: "1rem", border: "1px solid #e2e8f0", borderRadius: "8px" }}>
                <strong style={{ display: "block", color: "#1e293b", marginBottom: "0.5rem", fontSize: "0.9rem" }}>3. Stemming (Root Words)</strong>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "0.5rem" }}>
                  {stemmed.map((t, i) => <span key={i} style={{ background: "#dcfce7", padding: "2px 6px", borderRadius: "4px", fontSize: "0.8rem", color: "#166534" }}>{t}</span>)}
                </div>
              </div>
            </div>
          </div>
        )
      }

      return (
        <div style={{ marginTop: "4rem", borderTop: "1px solid #e2e8f0", paddingTop: "4rem" }}>
          <div style={{ color: "rgba(21,128,61,0.8)", fontSize: "0.7rem", fontFamily: "sans-serif", letterSpacing: "0.3em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>Edureka Interactive Module</div>
          <h3 style={{ fontSize: "2.2rem", color: "#1a1a1a", marginBottom: "1.5rem", fontWeight: "normal", lineHeight: 1.2, fontFamily: "'Playfair Display', serif" }}>Fundamental AI Questions & Simulations</h3>
          <p style={{ ...bodyStyle, maxWidth: "900px" }}>To further ground our understanding, we will explore the foundational questions of AI, the 7-step Machine Learning pipeline, the mechanics of a Perceptron, and Natural Language Processing. Select a module below to begin the simulation.</p>

          <div style={{ display: "flex", gap: "1rem", marginBottom: "2rem", borderBottom: "1px solid #e2e8f0", paddingBottom: "1rem" }}>
            {['Fundamentals', 'ML Pipeline', 'Perceptron Lab', 'NLP Engine'].map(t => (
              <button
                key={t}
                onClick={() => setTab(t.toLowerCase())}
                style={{
                  padding: "0.5rem 1rem",
                  background: tab === t.toLowerCase() ? "#15803d" : "transparent",
                  color: tab === t.toLowerCase() ? "#fff" : "#475569",
                  border: "none",
                  borderRadius: "4px",
                  fontWeight: "bold",
                  cursor: "pointer",
                  fontFamily: "sans-serif",
                  transition: "all 0.2s"
                }}
              >
                {t}
              </button>
            ))}
          </div>

          {/* Render Tabs */}
          {tab === 'fundamentals' && (
            <div style={{ background: "#ffffff", padding: "2rem", borderRadius: "1rem", border: "1px solid #e2e8f0", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)" }}>
              <h4 style={{ color: "#15803d", fontSize: "1.2rem", marginBottom: "1rem", fontWeight: "bold", fontFamily: "'Playfair Display', serif" }}>1. The Turing Test & AI Types</h4>
              <p style={{ fontSize: "0.9rem", color: "#475569", lineHeight: 1.6, marginBottom: "1.5rem", fontFamily: "sans-serif" }}>Proposed by Alan Turing in 1950, the Turing Test evaluates if a machine can exhibit human-like intelligence. Below are the 4 theoretical stages of AI evolution.</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem" }}>
                <div style={{ padding: "1rem", border: "1px solid #e2e8f0", borderRadius: "8px", background: "#f8fafc" }}>
                  <strong style={{ color: "#1e293b", display: "block", marginBottom: "0.5rem" }}>1. Reactive Machines</strong>
                  <span style={{ fontSize: "0.8rem", color: "#64748b" }}>Operates solely on present data without relying on past memories. Example: IBM Deep Blue (Chess).</span>
                </div>
                <div style={{ padding: "1rem", border: "1px solid #e2e8f0", borderRadius: "8px", background: "#f8fafc" }}>
                  <strong style={{ color: "#1e293b", display: "block", marginBottom: "0.5rem" }}>2. Limited Memory</strong>
                  <span style={{ fontSize: "0.8rem", color: "#64748b" }}>Uses recent past experiences to make immediate decisions. Example: Self-driving cars reading live traffic patterns.</span>
                </div>
                <div style={{ padding: "1rem", border: "1px solid #e2e8f0", borderRadius: "8px", background: "#f8fafc" }}>
                  <strong style={{ color: "#1e293b", display: "block", marginBottom: "0.5rem" }}>3. Theory of Mind</strong>
                  <span style={{ fontSize: "0.8rem", color: "#64748b" }}>Understands human emotions, beliefs, and complex social interactions. (Currently purely in the research phase).</span>
                </div>
                <div style={{ padding: "1rem", border: "1px solid #e2e8f0", borderRadius: "8px", background: "#f8fafc" }}>
                  <strong style={{ color: "#1e293b", display: "block", marginBottom: "0.5rem" }}>4. Self-Aware AI</strong>
                  <span style={{ fontSize: "0.8rem", color: "#64748b" }}>Machines with human-level consciousness and self-awareness. (Hypothetical/Sci-Fi).</span>
                </div>
              </div>
            </div>
          )}

          {tab === 'ml pipeline' && (
            <div style={{ background: "#ffffff", padding: "2rem", borderRadius: "1rem", border: "1px solid #e2e8f0", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)" }}>
              <h4 style={{ color: "#15803d", fontSize: "1.2rem", marginBottom: "1rem", fontWeight: "bold", fontFamily: "'Playfair Display', serif" }}>2. The 7-Step Machine Learning Process</h4>
              <div style={{ display: "flex", flexDirection: "column", gap: "0.5rem" }}>
                {[
                  { s: "1. Define Objective", d: "What are we trying to predict? (e.g., Rain tomorrow?)" },
                  { s: "2. Data Gathering", d: "Collect historical data (humidity, temperature, pressure)." },
                  { s: "3. Data Preparation", d: "Clean data, remove nulls, drop irrelevant features to prevent noise." },
                  { s: "4. Exploratory Data Analysis (EDA)", d: "Brainstorming phase: Find hidden patterns and correlations in the data." },
                  { s: "5. Build ML Model", d: "Split data (Train/Test) and apply algorithms (e.g., Logistic Regression or SVM)." },
                  { s: "6. Model Evaluation", d: "Check efficiency using the testing dataset to prevent overfitting." },
                  { s: "7. Predictions", d: "Deploy the model to make future predictions on unseen continuous or categorical data." }
                ].map((step, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: "1rem", padding: "0.8rem", background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: "8px" }}>
                    <div style={{ background: "#15803d", color: "#fff", width: "24px", height: "24px", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "50%", fontSize: "0.8rem", fontWeight: "bold" }}>{i+1}</div>
                    <div>
                      <strong style={{ color: "#166534", fontSize: "0.9rem" }}>{step.s}</strong>
                      <div style={{ color: "#14532d", fontSize: "0.8rem", marginTop: "0.2rem" }}>{step.d}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'perceptron lab' && <PerceptronSim />}
          {tab === 'nlp engine' && <NLPSim />}
        </div>
      );
    }

    function AIPrimer() {      const [active, setActive] = useState("intro");

build projects" }, { num: "03", label: "How adoption changes organisations" }, { num: "04", label: "How managers govern risks and trade-offs" }].map(({ num, label }) => (                <div key={num}>                  <div style={{ fontSize: "1.7rem", color: "#15803d", fontStyle: "italic", fontFamily: "'Playfair Display', serif", fontWeight: "bold" }}>{num}</div>                  <div style={{ fontSize: "0.72rem", color: "#64748b", fontFamily: "sans-serif", maxWidth: "130px", lineHeight: 1.4, marginTop: "0.3rem", fontWeight: "500" }}>{label}</div>                </div>              ))}            </div>          </section>
          {/* ── CH1: WHAT IS AI ── */}          <section id="what" style={{ padding: "7rem 8rem", maxWidth: "1400px", margin: "0 auto" }}>            <ChapterHeader number="01" title="What Is Artificial Intelligence?" subtitle="Foundational concepts every educator must know" />            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4rem", alignItems: "start" }}>              <div>                <p style={bodyStyle}>Artificial Intelligence refers to computational systems designed to perform tasks that typically require human cognition — perceiving, reasoning, learning, and acting. Unlike traditional software that executes explicit instructions, AI systems <em>learn patterns</em> from data to make decisions or generate outputs.</p>                <p style={bodyStyle}>For business faculty, the critical distinction is between <strong style={{ color: "#15803d" }}>Narrow AI</strong> (systems optimized for specific tasks like credit scoring or fraud detection) and the more distant concept of <strong style={{ color: "#15803d" }}>General AI</strong> (hypothetical systems with human-level versatility). Every commercial AI tool in use today is narrow AI.</p>                <p style={bodyStyle}>The modern AI revolution is driven by three converging forces: <em>massive datasets</em>, <em>powerful computing hardware</em> (particularly GPUs), and <em>architectural breakthroughs</em> in neural network design — specifically the Transformer architecture introduced in 2017. Understanding this triangle helps explain why AI capabilities have accelerated so dramatically.</p>                <div style={{ background: "rgba(21,128,61,0.05)", border: "1px solid rgba(21,128,61,0.15)", padding: "1.5rem", marginTop: "1rem", borderRadius: "8px" }}>                  <div style={{ color: "#15803d", fontSize: "0.72rem", fontFamily: "sans-serif", letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>Key Insight for Faculty</div>                  <p style={{ color: "#475569", fontSize: "0.85rem", fontFamily: "sans-serif", lineHeight: 1.7, margin: 0 }}>Students will encounter AI through its outputs. Your role is to help them understand the mechanisms well enough to evaluate claims, spot limitations, and make strategic decisions — not to train them as AI engineers.</p>                </div>              </div>              <div style={{ display: "flex", flexDirection: "column", gap: "1.5rem" }}>                <ConceptCard title="The AI Hierarchy" items={[                  { label: "Artificial Intelligence", desc: "Broad field of making machines perform intelligent tasks", color: "#15803d" },                  { label: "Machine Learning", desc: "Systems that learn from data without explicit programming", color: "#16a34a" },                  { label: "Deep Learning", desc: "Multi-layered neural networks that mimic brain structure", color: "#22c55e" },                  { label: "Foundation Models", desc: "Massive pre-trained models (GPT, Claude, Gemini, Llama)", color: "#4ade80" },                  { label: "Generative AI", desc: "AI that creates new content: text, images, code, audio", color: "#86efac" },                ]} />                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "1rem" }}>                  {[{ icon: "🧠", title: "Machine Learning", body: "Models identify statistical patterns in training data and encode them as billions of numerical weights — tuned iteratively to minimise prediction error." }, { icon: "💬", title: "Large Language Models", body: "Trained on vast text to predict the next token. This simple objective, massively scaled, produces emergent capabilities: reasoning, coding, creative synthesis." }, { icon: "🎨", title: "Multimodal AI", body: "Modern systems process and generate across text, images, audio, video, and code — enabling entirely new classes of business application." }].map(({ icon, title, body }) => (                    <div key={title} style={{ background: "#ffffff", border: "1px solid #e2e8f0", padding: "1.2rem", borderRadius: "8px", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)" }}>                      <div style={{ fontSize: "1.5rem", marginBottom: "0.6rem" }}>{icon}</div>                      <h3 style={{ color: "#15803d", fontSize: "0.78rem", margin: "0 0 0.5rem 0", fontFamily: "sans-serif", fontWeight: "700", letterSpacing: "0.05em" }}>{title}</h3>                      <p style={{ color: "#475569", fontSize: "0.75rem", lineHeight: 1.6, fontFamily: "sans-serif", margin: 0 }}>{body}</p>                    </div>                  ))}                </div>              </div>            </div>

            {/* ── END OF MODULE INJECTIONS ── */}

          </section>
          {/* ── CH2: LANDSCAPE ── */}          <section id="landscape" style={{ background: "rgba(21,128,61,0.02)", borderTop: "1px solid #e2e8f0", borderBottom: "1px solid #e2e8f0", padding: "7rem 8rem" }}>            <div style={{ maxWidth: "1400px", margin: "0 auto" }}>              <ChapterHeader number="02" title="The Current AI Landscape" subtitle="Key players, technologies, and capabilities" />              <div style={{ display: "grid", gridTemplateColumns: "3fr 2fr", gap: "4rem" }}>                <div>                  <p style={bodyStyle}>The AI landscape has consolidated around a handful of foundation model providers while fragmenting into thousands of application-layer companies. Faculty should understand both layers: the infrastructure providers who train massive models, and the business applications built on top of them.</p>                  <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", marginTop: "2rem", marginBottom: "1.2rem", fontWeight: "bold" }}>Major Foundation Model Providers</h3>                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem" }}>                    {[{ co: "OpenAI", model: "GPT-4o, o1, o3", focus: "General-purpose, coding, advanced reasoning" }, { co: "Anthropic", model: "Claude 3.5 Sonnet", focus: "Safety-focused, long context, document analysis" }, { co: "Google DeepMind", model: "Gemini 1.5 Pro", focus: "Multimodal, real-time search, Google Workspace" }, { co: "Meta AI", model: "Llama 3 (open-source)", focus: "Open weights, customisable, self-hostable" }, { co: "Mistral", model: "Mistral Large", focus: "European provider, efficient, multilingual" }, { co: "xAI", model: "Grok", focus: "Real-time data via X/Twitter, less restricted" }].map(({ co, model, focus }) => (                      <div key={co} style={{ background: "#ffffff", border: "1px solid #e2e8f0", padding: "1rem 1.2rem", borderRadius: "8px", boxShadow: "0 2px 4px rgba(0,0,0,0.02)" }}>                        <div style={{ color: "#1a1a1a", fontFamily: "sans-serif", fontWeight: "700", fontSize: "0.85rem" }}>{co}</div>                        <div style={{ color: "#15803d", fontSize: "0.75rem", fontFamily: "sans-serif", marginTop: "0.2rem", fontWeight: "600" }}>{model}</div>                        <div style={{ color: "#475569", fontSize: "0.72rem", fontFamily: "sans-serif", marginTop: "0.3rem", lineHeight: 1.4 }}>{focus}</div>                      </div>                    ))}                  </div>                </div>                <div>                  <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: "1.5rem", fontWeight: "bold" }}>AI Capability Maturity</h3>                  {[{ cap: "Text Generation & Analysis", pct: 95 }, { cap: "Code Generation & Review", pct: 88 }, { cap: "Data Analysis & Reasoning", pct: 82 }, { cap: "Image & Visual Generation", pct: 78 }, { cap: "Audio, Voice & Transcription", pct: 72 }, { cap: "Video Generation", pct: 52 }, { cap: "Autonomous Multi-Step Agents", pct: 38 }].map(({ cap, pct }) => (                    <div key={cap} style={{ marginBottom: "1.2rem" }}>                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "0.4rem" }}>                        <span style={{ fontSize: "0.8rem", fontFamily: "sans-serif", color: "#1a1a1a", fontWeight: "500" }}>{cap}</span>                        <span style={{ fontSize: "0.72rem", color: "#15803d", fontFamily: "sans-serif", fontWeight: "bold" }}>{pct}%</span>                      </div>                      <div style={{ background: "#e2e8f0", height: "4px", borderRadius: "2px" }}>                        <div style={{ background: "linear-gradient(90deg, #15803d, #22c55e)", height: "4px", width: `${pct}%`, borderRadius: "2px" }} />                      </div>                    </div>                  ))}                  <p style={{ color: "#94a3b8", fontSize: "0.7rem", fontFamily: "sans-serif", marginTop: "1rem", lineHeight: 1.5 }}>*Relative maturity scores based on commercial deployment readiness and reliability, 2025.</p>                </div>              </div>            </div>          </section>
          {/* ── CH3: BUSINESS ── */}          <section id="business" style={{ padding: "7rem 8rem", maxWidth: "1400px", margin: "0 auto" }}>            <ChapterHeader number="03" title="AI's Impact on Business" subtitle="What MBA students will navigate in their careers" />            <p style={{ ...bodyStyle, maxWidth: "640px" }}>Business schools prepare students for a world AI is reshaping at every layer — from operational efficiency to strategic positioning to industry disruption. Faculty must understand these dynamics to contextualise AI within functional and strategic frameworks.</p>            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "1.5rem", marginTop: "2.5rem" }}>              {[                { domain: "Strategy", icon: "♟️", points: ["AI as a new factor of production alongside labour and capital", "Platform vs. product strategies in AI-native markets", "Sustainable moats: proprietary data, distribution, talent density", "When to build, buy, or partner on AI capabilities"] },                { domain: "Operations", icon: "⚙️", points: ["Predictive demand forecasting and inventory optimisation", "Autonomous quality control and defect detection", "AI-powered logistics routing and supply chain resilience", "Workforce augmentation vs. automation trade-offs"] },                { domain: "Finance & Risk", icon: "📊", points: ["Algorithmic trading and quantitative portfolio management", "AI-driven credit underwriting and fraud detection", "Automated financial reporting and audit assistance", "Model risk management and algorithmic accountability"] },                { domain: "Marketing", icon: "🎯", points: ["Hyper-personalisation at scale across all touchpoints", "AI-generated content and creative production efficiency", "Predictive customer lifetime value and churn modelling", "Conversational commerce and AI-powered sales assistance"] },                { domain: "Human Resources", icon: "👥", points: ["AI-augmented recruiting, screening, and candidate matching", "Personalised learning and performance development paths", "Workforce planning under automation uncertainty", "Managing human-AI teaming and change resistance"] },                { domain: "Entrepreneurship", icon: "🚀", points: ["Lower barriers to product development (AI as co-founder)", "Identifying market gaps through AI-powered research", "Unit economics shifts in AI-native business models", "Speed of iteration and product-market fit discovery"] },              ].map(({ domain, icon, points }) => (                <div key={domain} style={{ border: "1px solid #e2e8f0", padding: "1.8rem", background: "#ffffff", borderRadius: "8px", boxShadow: "0 4px 6px -1px rgba(0,0,0,0.05)" }}>                  <div style={{ display: "flex", alignItems: "center", gap: "0.7rem", marginBottom: "1.2rem" }}>                    <span style={{ fontSize: "1.3rem" }}>{icon}</span>                    <h3 style={{ color: "#1a1a1a", fontSize: "0.95rem", fontFamily: "sans-serif", fontWeight: "700", letterSpacing: "0.05em", margin: 0 }}>{domain}</h3>                  </div>                  <ul style={{ listStyle: "none", padding: 0, margin: 0 }}>                    {points.map((p) => (                      <li key={p} style={{ color: "#475569", fontSize: "0.82rem", fontFamily: "sans-serif", lineHeight: 1.6, paddingLeft: "1rem", position: "relative", marginBottom: "0.45rem" }}>                        <span style={{ position: "absolute", left: 0, color: "#15803d", fontWeight: "bold" }}>›</span>{p}                      </li>                    ))}                  </ul>                </div>              ))}            </div>            <div style={{ marginTop: "2.5rem", background: "rgba(21,128,61,0.05)", border: "1px solid rgba(21,128,61,0.2)", padding: "2.5rem", borderRadius: "8px", display: "grid", gridTemplateColumns: "auto 1fr", gap: "2.5rem" }}>              <div style={{ borderRight: "2px solid #15803d", paddingRight: "2.5rem" }}>                <div style={{ color: "#15803d", fontSize: "0.65rem", fontFamily: "sans-serif", letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: "0.5rem", fontWeight: "bold" }}>Disruption Alert</div>                <div style={{ color: "#1a1a1a", fontSize: "1.5rem", fontStyle: "italic", lineHeight: 1.3, fontFamily: "'Playfair Display', serif" }}>Most<br />Disrupted<br />Sectors</div>              </div>              <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: "1.5rem" }}>                {[{ sector: "Financial Services", disruption: "Very High", detail: "Underwriting, trading, advice, compliance" }, { sector: "Legal Services", disruption: "Very High", detail: "Research, contracts, discovery, drafting" }, { sector: "Media & Advertising", disruption: "Very High", detail: "Content creation, targeting, measurement" }, { sector: "Healthcare", disruption: "High", detail: "Diagnostics, drug discovery, admin" }, { sector: "Management Consulting", disruption: "High", detail: "Analysis, research, report synthesis" }].map(({ sector, disruption, detail }) => (                  <div key={sector}>                    <div style={{ color: "#15803d", fontSize: "0.72rem", fontFamily: "sans-serif", fontWeight: "700", textTransform: "uppercase", letterSpacing: "0.05em" }}>{disruption}</div>                    <div style={{ color: "#1a1a1a", fontSize: "0.85rem", fontFamily: "sans-serif", marginTop: "0.3rem", fontWeight: "700" }}>{sector}</div>                    <div style={{ color: "#475569", fontSize: "0.75rem", fontFamily: "sans-serif", marginTop: "0.2rem", lineHeight: 1.4 }}>{detail}</div>                  </div>                ))}              </div>            </div>          </section>
          {/* ── CH4: TEACHING ── */}          <section id="teaching" style={{ background: "rgba(21,128,61,0.02)", borderTop: "1px solid #e2e8f0", borderBottom: "1px solid #e2e8f0", padding: "7rem 8rem" }}>            <div style={{ maxWidth: "1400px", margin: "0 auto" }}>              <ChapterHeader number="04" title="Teaching AI in the MBA Classroom" subtitle="Pedagogical strategies, frameworks, and course design" />              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4rem" }}>                <div>                  <p style={bodyStyle}>The goal is not to produce AI engineers — it's to develop <em>AI-fluent leaders</em> who can ask the right questions, oversee AI implementations, and make sound strategic decisions in AI-augmented organisations.</p>                  <p style={bodyStyle}>Effective AI pedagogy blends conceptual frameworks with hands-on experimentation. Students should leave able to critically evaluate AI claims, structure AI projects, and lead cross-functional teams through AI adoption.</p>                  <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", margin: "2.5rem 0 1.5rem 0", fontWeight: "bold" }}>The 4-Layer AI Fluency Model</h3>                  {[{ layer: "Layer 1: Literacy", desc: "Understanding what AI is, how it works conceptually, and its fundamental limitations and failure modes" }, { layer: "Layer 2: Application", desc: "Identifying where AI creates value in specific business contexts, functions, and competitive situations" }, { layer: "Layer 3: Evaluation", desc: "Critically assessing AI outputs, vendor claims, model risks, and implementation challenges" }, { layer: "Layer 4: Leadership", desc: "Governing AI strategy, managing AI teams, driving organisational change, and ensuring accountability" }].map(({ layer, desc }, i) => (                    <div key={layer} style={{ display: "flex", gap: "1rem", marginBottom: "1.2rem", alignItems: "start" }}>                      <div style={{ width: "26px", height: "26px", borderRadius: "50%", border: "1px solid #15803d", display: "flex", alignItems: "center", justifyContent: "center", color: "#15803d", fontSize: "0.68rem", fontFamily: "sans-serif", flexShrink: 0, marginTop: "2px", fontWeight: "bold" }}>{i + 1}</div>                      <div>                        <div style={{ color: "#1a1a1a", fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "700" }}>{layer}</div>                        <div style={{ color: "#475569", fontSize: "0.8rem", fontFamily: "sans-serif", marginTop: "0.2rem", lineHeight: 1.5 }}>{desc}</div>                      </div>                    </div>                  ))}                </div>                <div>                  <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: "1.5rem", fontWeight: "bold" }}>Classroom Activities That Work</h3>                  {[{ activity: "Prompt Engineering Workshop", type: "Hands-On", desc: "Students craft, test, and iterate prompts for a real business problem. Teaches precision in communication and reveals model limitations in real time." }, { activity: "AI Audit Case Study", type: "Critical Thinking", desc: "Analyse real AI failures (Amazon hiring tool, COMPAS recidivism, Zillow pricing algorithm). Develop evaluation frameworks students can apply throughout their careers." }, { activity: "AI Business Plan Challenge", type: "Capstone", desc: "Teams design an AI-native product or AI-augmented process. Covers strategy, unit economics, ethics, and implementation planning." }, { activity: "Live Model Debate", type: "Discussion", desc: "Students argue for/against AI adoption in a specific context, then run the same scenario through an LLM to compare quality of reasoning and spot AI blind spots." }, { activity: "AI Tool Benchmark", type: "Research", desc: "Compare multiple AI tools on the same task (e.g., M&A memo drafting). Students evaluate accuracy, bias, hallucination risk, and business fit." }].map(({ activity, type, desc }) => (                    <div key={activity} style={{ marginBottom: "1rem", padding: "1.2rem", background: "#ffffff", borderLeft: "3px solid #15803d", borderTop: "1px solid #e2e8f0", borderRight: "1px solid #e2e8f0", borderBottom: "1px solid #e2e8f0", borderRadius: "0 8px 8px 0", boxShadow: "0 2px 4px rgba(0,0,0,0.02)" }}>                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.5rem" }}>                        <div style={{ color: "#1a1a1a", fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "700" }}>{activity}</div>                        <div style={{ color: "#15803d", fontSize: "0.62rem", fontFamily: "sans-serif", letterSpacing: "0.1em", textTransform: "uppercase", border: "1px solid rgba(21,128,61,0.3)", padding: "3px 8px", borderRadius: "4px", background: "rgba(21,128,61,0.05)", whiteSpace: "nowrap", fontWeight: "bold" }}>{type}</div>                      </div>                      <div style={{ color: "#475569", fontSize: "0.8rem", fontFamily: "sans-serif", lineHeight: 1.6 }}>{desc}</div>                    </div>                  ))}                </div>              </div>              <div style={{ marginTop: "3.5rem", borderTop: "1px solid #e2e8f0", paddingTop: "3rem" }}>                <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: "1.8rem", fontWeight: "bold" }}>Rethinking Assessment in the AI Era</h3>                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "1.5rem" }}>                  {[{ title: "Process-Based Assessment", body: "Evaluate reasoning process, not just output. Require documentation of AI use, prompt iterations, and critical evaluation of responses. The thinking matters more than the result." }, { title: "Oral Examinations", body: "Supplement written work with verbal defence. A student who truly understands AI-assisted work can explain it, extend it, and critique it in real time." }, { title: "AI-Integrated Tasks", body: "Design assignments where AI is expected and the student's value-add is explicitly in synthesis, judgment, and creativity — skills AI cannot reliably replicate." }].map(({ title, body }) => (                    <div key={title} style={{ background: "rgba(21,128,61,0.02)", border: "1px solid rgba(21,128,61,0.15)", padding: "1.5rem", borderRadius: "8px" }}>                      <div style={{ color: "#15803d", fontSize: "0.65rem", fontFamily: "sans-serif", letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>Recommended</div>                      <h4 style={{ color: "#1a1a1a", fontSize: "0.95rem", fontFamily: "sans-serif", fontWeight: "700", margin: "0 0 0.7rem 0" }}>{title}</h4>                      <p style={{ color: "#475569", fontSize: "0.8rem", fontFamily: "sans-serif", lineHeight: 1.65, margin: 0 }}>{body}</p>                    </div>                  ))}                </div>              </div>            </div>          </section>
          {/* ── CH5: TOOLS ── */}          <section id="tools" style={{ padding: "7rem 8rem", maxWidth: "1400px", margin: "0 auto" }}>            <ChapterHeader number="05" title="Essential AI Tools for Faculty" subtitle="Your practical toolkit for research, teaching, and administration" />            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "1.5rem" }}>              {[                { category: "General AI Assistants", color: "#15803d", tools: [{ name: "Claude (Anthropic)", use: "Long-form analysis, document review, research synthesis, nuanced reasoning" }, { name: "ChatGPT (OpenAI)", use: "General tasks, code generation, creative work, broad knowledge" }, { name: "Gemini (Google)", use: "Web-connected research, multimodal tasks, Google Workspace integration" }] },                { category: "Research & Literature", color: "#0f172a", tools: [{ name: "Elicit", use: "AI-powered literature review and research paper synthesis" }, { name: "Consensus", use: "Evidence-based answers drawn from peer-reviewed research" }, { name: "Perplexity AI", use: "Real-time search with source citations for current topics" }] },                { category: "Data & Analysis", color: "#3b82f6", tools: [{ name: "Julius AI", use: "Natural language data analysis and chart generation" }, { name: "Code Interpreter (GPT)", use: "Run Python/R analyses conversationally; great for teaching" }, { name: "NotebookLM", use: "AI assistant trained on your own research documents" }] },                { category: "Presentations & Content", color: "#6366f1", tools: [{ name: "Gamma", use: "AI-generated slide decks from outlines or topic prompts" }, { name: "Canva AI", use: "Image generation and graphic design for course materials" }, { name: "Beautiful.ai", use: "Smart presentation templates with AI layout suggestions" }] },                { category: "Audio, Video & Transcription", color: "#059669", tools: [{ name: "Otter.ai", use: "Automatic transcription of lectures, meetings, interviews" }, { name: "Descript", use: "Edit video by editing text transcript — ideal for lecture clips" }, { name: "ElevenLabs", use: "Realistic text-to-speech narration for course content" }] },                { category: "Productivity & Admin", color: "#dc2626", tools: [{ name: "Microsoft Copilot", use: "AI integrated into Word, Excel, PowerPoint, and Outlook" }, { name: "Notion AI", use: "AI writing, summarising, and organising within Notion" }, { name: "Grammarly Enterprise", use: "AI writing assistance, clarity, and tone improvement" }] },              ].map(({ category, color, tools }) => (                <div key={category} style={{ border: "1px solid #e2e8f0", padding: "1.8rem", background: "#ffffff", borderRadius: "8px", boxShadow: "0 2px 4px rgba(0,0,0,0.02)" }}>                  <div style={{ width: "30px", height: "4px", background: color, marginBottom: "1rem", borderRadius: "2px" }} />                  <h3 style={{ color: "#1a1a1a", fontSize: "0.95rem", fontFamily: "sans-serif", fontWeight: "700", margin: "0 0 1.2rem 0", letterSpacing: "0.02em" }}>{category}</h3>                  {tools.map(({ name, use }, i) => (                    <div key={name} style={{ marginBottom: "1rem", paddingBottom: "1rem", borderBottom: i < tools.length - 1 ? "1px solid #e2e8f0" : "none" }}>                      <div style={{ color, fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "700" }}>{name}</div>                      <div style={{ color: "#475569", fontSize: "0.8rem", fontFamily: "sans-serif", marginTop: "0.3rem", lineHeight: 1.5 }}>{use}</div>                    </div>                  ))}                </div>              ))}            </div>            <div style={{ marginTop: "2rem", background: "rgba(21,128,61,0.05)", border: "1px solid rgba(21,128,61,0.2)", padding: "1.8rem", borderRadius: "8px" }}>              <p style={{ color: "#15803d", fontSize: "0.75rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", margin: "0 0 0.6rem 0", fontWeight: "bold" }}>⚠ Data Privacy Note for Faculty</p>              <p style={{ color: "#475569", fontSize: "0.85rem", fontFamily: "sans-serif", lineHeight: 1.7, margin: 0 }}>Always verify your institution's data policies before uploading student records, proprietary research, or confidential materials to AI tools. Many tools use inputs for future training unless you opt out. Enterprise tiers typically offer stronger privacy guarantees. Model responsible AI governance for students by publishing a clear AI use policy for your courses.</p>            </div>          </section>
          {/* ── CH6: ETHICS ── */}          <section id="ethics" style={{ background: "rgba(21,128,61,0.02)", borderTop: "1px solid #e2e8f0", borderBottom: "1px solid #e2e8f0", padding: "7rem 8rem" }}>            <div style={{ maxWidth: "1400px", margin: "0 auto" }}>              <ChapterHeader number="06" title="AI Ethics & Responsible Use" subtitle="The governance framework every business leader needs" />              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4rem" }}>                <div>                  <p style={bodyStyle}>AI ethics is not a peripheral compliance exercise — it is a core strategic and leadership competency. Business leaders who cannot identify, evaluate, and mitigate AI risks will expose their organisations to regulatory, reputational, and operational failures.</p>                  <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", margin: "2rem 0 1.5rem 0", fontWeight: "bold" }}>Core Ethical Dimensions</h3>                  {[{ dim: "Fairness & Bias", desc: "AI systems reflect and amplify historical biases in training data. Facial recognition errors, biased hiring algorithms, discriminatory credit scoring — all are live business and legal risks." }, { dim: "Transparency & Explainability", desc: "Regulated industries demand explainable decisions. The 'black box' problem is both an ethical issue and a compliance challenge in finance, healthcare, and legal services." }, { dim: "Privacy & Data Rights", desc: "AI enables unprecedented behavioural prediction. GDPR, CCPA, and emerging AI-specific regulations are reshaping data strategy and creating new C-suite roles." }, { dim: "Accountability & Liability", desc: "When AI systems cause harm, who is responsible? Organisations must establish clear chains of accountability for algorithmic decisions that affect people's lives." }, { dim: "Environmental Impact", desc: "Training large AI models consumes significant energy and water. The carbon footprint of AI is becoming a material ESG consideration for boards, investors, and regulators." }].map(({ dim, desc }) => (                    <div key={dim} style={{ marginBottom: "1.4rem", paddingLeft: "1.2rem", borderLeft: "3px solid rgba(21,128,61,0.3)" }}>                      <div style={{ color: "#1a1a1a", fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "700", marginBottom: "0.35rem" }}>{dim}</div>                      <div style={{ color: "#475569", fontSize: "0.8rem", fontFamily: "sans-serif", lineHeight: 1.6 }}>{desc}</div>                    </div>                  ))}                </div>                <div>                  <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: "1.5rem", fontWeight: "bold" }}>AI Governance Framework</h3>                  {[{ phase: "01. Assess", items: ["Identify AI use cases and associated risk levels", "Map data sources and potential biases", "Evaluate applicable regulatory requirements"] }, { phase: "02. Design", items: ["Build fairness constraints into model specifications", "Establish human oversight checkpoints", "Define explainability and documentation requirements"] }, { phase: "03. Test", items: ["Stress-test for edge cases and failure modes", "Conduct bias audits and disparate impact analyses", "Red-team adversarial scenarios and misuse cases"] }, { phase: "04. Deploy", items: ["Monitor model performance continuously post-launch", "Establish feedback loops and correction mechanisms", "Publish model cards documenting capabilities and limits"] }, { phase: "05. Govern", items: ["Assign AI risk ownership at board and executive level", "Conduct regular ethics reviews as models and context evolve", "Track regulatory developments globally and adapt policies"] }].map(({ phase, items }) => (                    <div key={phase} style={{ marginBottom: "1rem", background: "#ffffff", border: "1px solid #e2e8f0", padding: "1.2rem", borderRadius: "8px", boxShadow: "0 2px 4px rgba(0,0,0,0.02)" }}>                      <div style={{ color: "#15803d", fontSize: "0.75rem", fontFamily: "sans-serif", letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: "0.7rem", fontWeight: "bold" }}>{phase}</div>                      <ul style={{ listStyle: "none", padding: 0, margin: 0 }}>                        {items.map((item) => (                          <li key={item} style={{ color: "#475569", fontSize: "0.8rem", fontFamily: "sans-serif", lineHeight: 1.6, paddingLeft: "0.8rem", position: "relative" }}>                            <span style={{ position: "absolute", left: 0, color: "#15803d", fontWeight: "bold" }}>·</span>{item}                          </li>                        ))}                      </ul>                    </div>                  ))}                </div>              </div>              <div style={{ marginTop: "3rem", background: "#fef2f2", border: "1px solid #fca5a5", padding: "2.5rem", borderRadius: "8px" }}>                <h3 style={{ color: "#dc2626", fontSize: "0.85rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", margin: "0 0 1.2rem 0", fontWeight: "bold" }}>⚡ Academic Integrity in the AI Era</h3>                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "2rem" }}>                  {[{ title: "Detection is Unreliable", body: "AI detection tools carry high false-positive rates and are easily circumvented. Over-reliance creates adversarial dynamics and unfairly penalises honest students." }, { title: "Policy Clarity is Essential", body: "Publish explicit AI use policies per assessment. Distinguish between acceptable tool use, active assistance, and ghostwriting. Ambiguity breeds dishonesty." }, { title: "Design for Understanding", body: "The most effective approach: design assessments that reward genuine higher-order thinking — novel analysis, personal experience, oral defence — that AI cannot replicate." }].map(({ title, body }) => (                    <div key={title}>                      <div style={{ color: "#b91c1c", fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "700", marginBottom: "0.5rem" }}>{title}</div>                      <div style={{ color: "#475569", fontSize: "0.8rem", fontFamily: "sans-serif", lineHeight: 1.65 }}>{body}</div>                    </div>                  ))}                </div>              </div>            </div>          </section>
          {/* ── CH7: FUTURE ── */}          <section id="future" style={{ padding: "7rem 8rem", maxWidth: "1400px", margin: "0 auto" }}>            <ChapterHeader number="07" title="The Road Ahead" subtitle="Preparing students for a future we can't fully predict" />            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4rem" }}>              <div>                <p style={bodyStyle}>The pace of AI progress makes long-range prediction unreliable. Rather than forecasting specific outcomes, the most valuable thing faculty can offer students is a <em>durable framework for navigating change</em> — intellectual humility, rapid learning capacity, and the ability to ask penetrating questions about technology and its organisational consequences.</p>                <p style={bodyStyle}>The skills that remain distinctly human — ethical judgment, creative synthesis, political navigation, empathetic leadership, and deep relationship-building — become <em>more</em> valuable as AI handles more cognitive labour. MBA programmes that develop these alongside AI fluency will produce the most resilient graduates.</p>                <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", margin: "2.5rem 0 1.5rem 0", fontWeight: "bold" }}>Emerging Developments to Watch</h3>                {[{ trend: "Agentic AI Systems", timeline: "2025–2027", desc: "AI that plans and executes multi-step tasks autonomously. Will profoundly transform professional services, knowledge work, and software development." }, { trend: "AI Regulation", timeline: "2025–2030", desc: "EU AI Act enforcement, US executive orders, and global regulatory fragmentation will create major new compliance and governance functions in every major organisation." }, { trend: "AI-Native Organisations", timeline: "2026–2030", desc: "Companies designed from inception around AI capabilities rather than retrofitting AI onto legacy human-designed processes and structures." }, { trend: "Reasoning & Scientific AI", timeline: "2025–2028", desc: "Systems with dramatically improved causal reasoning, mathematical ability, and scientific discovery capabilities — beginning to assist real R&D." }].map(({ trend, timeline, desc }) => (                  <div key={trend} style={{ marginBottom: "1.5rem", display: "grid", gridTemplateColumns: "90px 1fr", gap: "1rem" }}>                    <div style={{ color: "#15803d", fontSize: "0.7rem", fontFamily: "sans-serif", letterSpacing: "0.08em", textTransform: "uppercase", lineHeight: 1.4, paddingTop: "3px", fontWeight: "bold" }}>{timeline}</div>                    <div>                      <div style={{ color: "#1a1a1a", fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "700", marginBottom: "0.3rem" }}>{trend}</div>                      <div style={{ color: "#475569", fontSize: "0.8rem", fontFamily: "sans-serif", lineHeight: 1.6 }}>{desc}</div>                    </div>                  </div>                ))}              </div>              <div>                <h3 style={{ color: "#15803d", fontSize: "0.82rem", fontFamily: "sans-serif", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: "0.8rem", fontWeight: "bold" }}>Durable Human Competencies</h3>                <p style={{ color: "#475569", fontSize: "0.85rem", fontFamily: "sans-serif", lineHeight: 1.6, marginBottom: "1.5rem" }}>What MBA programmes should double down on — AI will augment but not replace these:</p>                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem", marginBottom: "2.5rem" }}>                  {[{ skill: "Strategic Judgment", desc: "Knowing which problems are worth solving and why" }, { skill: "Ethical Reasoning", desc: "Making defensible decisions under genuine uncertainty" }, { skill: "Stakeholder Navigation", desc: "Aligning diverse humans behind shared strategic goals" }, { skill: "Creative Problem-Framing", desc: "Asking better questions than AI is ever given" }, { skill: "Systems Thinking", desc: "Seeing second-order effects and feedback loops AI misses" }, { skill: "Cross-Cultural Intelligence", desc: "Navigating global contexts with genuine nuance" }, { skill: "Resilience & Adaptability", desc: "Leading organisations through discontinuous change" }, { skill: "Inspiration & Persuasion", desc: "Moving people to act, not just informing them" }].map(({ skill, desc }) => (                    <div key={skill} style={{ background: "#ffffff", border: "1px solid #e2e8f0", padding: "1.2rem", borderRadius: "8px", boxShadow: "0 2px 4px rgba(0,0,0,0.02)" }}>                      <div style={{ color: "#15803d", fontSize: "0.85rem", fontFamily: "sans-serif", fontWeight: "700", marginBottom: "0.4rem" }}>{skill}</div>                      <div style={{ color: "#475569", fontSize: "0.75rem", fontFamily: "sans-serif", lineHeight: 1.5 }}>{desc}</div>                    </div>                  ))}                </div>                <div style={{ background: "rgba(21,128,61,0.02)", border: "1px solid rgba(21,128,61,0.15)", padding: "2rem", position: "relative", borderRadius: "8px" }}>                  <div style={{ position: "absolute", top: "0.5rem", left: "1.2rem", color: "rgba(21,128,61,0.1)", fontSize: "5rem", fontFamily: "'Playfair Display', serif", lineHeight: 1 }}>"</div>                  <p style={{ color: "#1a1a1a", fontSize: "1.1rem", fontStyle: "italic", lineHeight: 1.9, paddingTop: "1.5rem", margin: 0, fontFamily: "'Playfair Display', serif" }}>                    The business leaders of tomorrow will not be those who can do what AI does — they will be those who know what only humans should do, and who have the courage and judgment to act on that knowledge.                  </p>                  <div style={{ color: "#475569", fontSize: "0.75rem", fontFamily: "sans-serif", marginTop: "1.2rem", fontWeight: "bold", textTransform: "uppercase", letterSpacing: "0.05em" }}>A guiding principle for MBA curricula</div>                </div>              </div>            </div>          </section>
