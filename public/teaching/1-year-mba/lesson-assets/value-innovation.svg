<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Value innovation schematic</title><desc id="desc">Buyer value rises while the firm's cost base falls, and the two movements meet in value innovation.</desc>
  <defs><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0891b2"/></linearGradient><marker id="up" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 z" fill="#16a34a"/></marker><marker id="down" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 z" fill="#dc2626"/></marker></defs>
  <rect width="960" height="620" rx="28" fill="#f8fafc"/><text x="480" y="70" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Value innovation breaks the usual trade-off</text><text x="480" y="106" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Do not add features and costs indiscriminately; redesign the activity system.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="95" y="195" width="270" height="240" rx="24" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="230" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Raise buyer value</text><text x="230" y="292" text-anchor="middle" font-size="16" fill="#334155">Create and raise the factors</text><text x="230" y="318" text-anchor="middle" font-size="16" fill="#334155">customers truly value</text><path d="M230 390 V330" stroke="#16a34a" stroke-width="8" marker-end="url(#up)"/>
    <rect x="595" y="195" width="270" height="240" rx="24" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="730" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">Lower structural cost</text><text x="730" y="292" text-anchor="middle" font-size="16" fill="#334155">Eliminate and reduce the factors</text><text x="730" y="318" text-anchor="middle" font-size="16" fill="#334155">the industry overprovides</text><path d="M730 335 V395" stroke="#dc2626" stroke-width="8" marker-end="url(#down)"/>
    <path d="M370 315 H420" stroke="#2563eb" stroke-width="5"/><path d="M590 315 H540" stroke="#2563eb" stroke-width="5"/>
    <circle cx="480" cy="315" r="96" fill="url(#core)"/><text x="480" y="303" text-anchor="middle" font-size="25" font-weight="700" fill="white">VALUE</text><text x="480" y="337" text-anchor="middle" font-size="25" font-weight="700" fill="white">INNOVATION</text>
    <rect x="235" y="490" width="490" height="70" rx="18" fill="#e0f2fe" stroke="#7dd3fc"/><text x="480" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">Result: a new value curve, not a compromise</text><text x="480" y="545" text-anchor="middle" font-size="15" fill="#334155">Higher willingness to buy + a simpler, more coherent cost base</text>
  </g>
</svg>
