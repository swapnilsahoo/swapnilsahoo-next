<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
  <title id="title">Three dimensions of corporate strategy</title><desc id="desc">Corporate scope extends along vertical integration, product and market diversification, and geographic reach.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/></marker></defs><rect width="800" height="720" rx="28" fill="#0f172a"/>
  <text x="400" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="white">Three dimensions of corporate scope</text>
  <g font-family="Inter,Arial,sans-serif"><circle cx="400" cy="370" r="93" fill="#f59e0b"/><text x="400" y="359" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">CORPORATE</text><text x="400" y="390" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">STRATEGY</text>
  <path d="M400 270 V145" stroke="#f59e0b" stroke-width="5" marker-end="url(#a)"/><rect x="250" y="80" width="300" height="95" rx="18" fill="#1e293b" stroke="#475569"/><text x="400" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#fbbf24">Vertical integration</text><text x="400" y="148" text-anchor="middle" font-size="15" fill="#cbd5e1">Which stages of the value chain should we own?</text>
  <path d="M320 420 L190 505" stroke="#f59e0b" stroke-width="5" marker-end="url(#a)"/><rect x="45" y="500" width="305" height="115" rx="18" fill="#1e293b" stroke="#475569"/><text x="197" y="541" text-anchor="middle" font-size="21" font-weight="700" fill="#fbbf24">Product-market scope</text><text x="197" y="571" text-anchor="middle" font-size="15" fill="#cbd5e1">Which businesses, products, and customers</text><text x="197" y="594" text-anchor="middle" font-size="15" fill="#cbd5e1">belong together?</text>
  <path d="M480 420 L610 505" stroke="#f59e0b" stroke-width="5" marker-end="url(#a)"/><rect x="450" y="500" width="305" height="115" rx="18" fill="#1e293b" stroke="#475569"/><text x="602" y="541" text-anchor="middle" font-size="21" font-weight="700" fill="#fbbf24">Geographic scope</text><text x="602" y="571" text-anchor="middle" font-size="15" fill="#cbd5e1">In which regions and countries should</text><text x="602" y="594" text-anchor="middle" font-size="15" fill="#cbd5e1">the firm compete?</text></g>
</svg>
