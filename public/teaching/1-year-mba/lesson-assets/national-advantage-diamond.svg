<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">National competitive advantage diamond</title><desc id="desc">Factor conditions, demand conditions, related and supporting industries, and firm strategy, structure, and rivalry reinforce one another within the national context.</desc><rect width="980" height="720" rx="28" fill="#f8fafc"/>
  <text x="490" y="60" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">A national advantage is a reinforcing system</text><text x="490" y="96" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748b">Four conditions shape where industries become unusually capable and competitive.</text>
  <path d="M490 170 L760 360 L490 550 L220 360 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="315" y="120" width="350" height="110" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="490" y="164" font-size="21" font-weight="700" fill="#1e3a8a">Firm strategy, structure &amp; rivalry</text><text x="490" y="196" font-size="14" fill="#475569">How firms are organized, governed, and challenged</text>
  <rect x="65" y="300" width="330" height="120" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="230" y="348" font-size="22" font-weight="700" fill="#14532d">Factor conditions</text><text x="230" y="381" font-size="14" fill="#475569">Skills · infrastructure · knowledge · capital</text>
  <rect x="585" y="300" width="330" height="120" rx="20" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/><text x="750" y="348" font-size="22" font-weight="700" fill="#831843">Demand conditions</text><text x="750" y="381" font-size="14" fill="#475569">Sophisticated customers and early signals</text>
  <rect x="315" y="500" width="350" height="110" rx="20" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="490" y="544" font-size="21" font-weight="700" fill="#78350f">Related &amp; supporting industries</text><text x="490" y="576" font-size="14" fill="#475569">Capable suppliers, clusters, and complements</text>
  <circle cx="490" cy="360" r="82" fill="#4f46e5"/><text x="490" y="348" font-size="21" font-weight="700" fill="white">NATIONAL</text><text x="490" y="378" font-size="21" font-weight="700" fill="white">ADVANTAGE</text>
  <rect x="290" y="646" width="400" height="42" rx="14" fill="#e2e8f0"/><text x="490" y="673" font-size="14" font-weight="700" fill="#334155">Government and chance influence the whole system</text></g>
</svg>
