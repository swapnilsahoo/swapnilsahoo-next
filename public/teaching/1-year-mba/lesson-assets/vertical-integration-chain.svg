<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Vertical integration across a value chain</title><desc id="desc">A five-stage chain runs from inputs to components, operations, channels, and customers; backward integration moves upstream and forward integration moves downstream.</desc>
  <defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#10b981"/></marker><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/></marker></defs><rect width="1000" height="520" rx="28" fill="#0f172a"/>
  <text x="500" y="65" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="white">Where should the firm draw its boundaries?</text><text x="500" y="101" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#94a3b8">Integration is a governance choice—not simply “own more.”</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="55" y="215" width="150" height="100" rx="18" fill="#1e293b" stroke="#475569"/><text x="130" y="255" font-size="18" font-weight="700" fill="white">Inputs</text><text x="130" y="282" font-size="14" fill="#94a3b8">Raw materials</text><rect x="240" y="215" width="150" height="100" rx="18" fill="#1e293b" stroke="#475569"/><text x="315" y="255" font-size="18" font-weight="700" fill="white">Components</text><text x="315" y="282" font-size="14" fill="#94a3b8">Suppliers</text><rect x="425" y="195" width="150" height="140" rx="18" fill="#f59e0b"/><text x="500" y="250" font-size="19" font-weight="700" fill="#111827">Focal firm</text><text x="500" y="280" font-size="14" fill="#422006">Core operations</text><rect x="610" y="215" width="150" height="100" rx="18" fill="#1e293b" stroke="#475569"/><text x="685" y="255" font-size="18" font-weight="700" fill="white">Channels</text><text x="685" y="282" font-size="14" fill="#94a3b8">Retail + delivery</text><rect x="795" y="215" width="150" height="100" rx="18" fill="#1e293b" stroke="#475569"/><text x="870" y="255" font-size="18" font-weight="700" fill="white">Customers</text><text x="870" y="282" font-size="14" fill="#94a3b8">Demand interface</text></g>
  <path d="M410 380 H110" stroke="#10b981" stroke-width="5" marker-end="url(#b)"/><text x="260" y="415" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#6ee7b7">Backward integration: move upstream</text><path d="M590 380 H890" stroke="#3b82f6" stroke-width="5" marker-end="url(#f)"/><text x="740" y="415" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#93c5fd">Forward integration: move downstream</text>
</svg>
