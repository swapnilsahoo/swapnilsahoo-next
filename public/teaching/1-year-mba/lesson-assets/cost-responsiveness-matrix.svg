<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">Cost pressure and local responsiveness matrix</title><desc id="desc">International, global-standardization, multidomestic, and transnational strategies occupy the four combinations of low or high cost pressure and local responsiveness.</desc><rect width="980" height="650" rx="28" fill="#f8fafc"/>
  <text x="535" y="57" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0f172a">Integration–responsiveness choices</text><text x="535" y="91" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#64748b">How much must the firm standardize globally, and how much must it adapt locally?</text>
  <g font-family="Inter,Arial,sans-serif"><text x="535" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">PRESSURE FOR COST REDUCTION →</text><text x="62" y="380" text-anchor="middle" transform="rotate(-90 62 380)" font-size="16" font-weight="700" fill="#334155">PRESSURE FOR LOCAL RESPONSIVENESS →</text>
  <text x="275" y="157" text-anchor="middle" font-size="14" fill="#64748b">LOW</text><text x="740" y="157" text-anchor="middle" font-size="14" fill="#64748b">HIGH</text><text x="130" y="260" text-anchor="middle" font-size="14" fill="#64748b">HIGH</text><text x="130" y="500" text-anchor="middle" font-size="14" fill="#64748b">LOW</text>
  <rect x="175" y="175" width="360" height="210" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/><rect x="535" y="175" width="360" height="210" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/><rect x="175" y="385" width="360" height="210" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><rect x="535" y="385" width="360" height="210" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="355" y="255" text-anchor="middle" font-size="25" font-weight="700" fill="#9d174d">Multidomestic</text><text x="355" y="291" text-anchor="middle" font-size="15" fill="#475569">Adapt products and operations</text><text x="355" y="315" text-anchor="middle" font-size="15" fill="#475569">country by country</text>
  <text x="715" y="255" text-anchor="middle" font-size="25" font-weight="700" fill="#5b21b6">Transnational</text><text x="715" y="291" text-anchor="middle" font-size="15" fill="#475569">Pursue efficiency, adaptation,</text><text x="715" y="315" text-anchor="middle" font-size="15" fill="#475569">and cross-border learning</text>
  <text x="355" y="465" text-anchor="middle" font-size="25" font-weight="700" fill="#1e40af">International</text><text x="355" y="501" text-anchor="middle" font-size="15" fill="#475569">Transfer distinctive capabilities</text><text x="355" y="525" text-anchor="middle" font-size="15" fill="#475569">with limited adaptation</text>
  <text x="715" y="465" text-anchor="middle" font-size="25" font-weight="700" fill="#166534">Global standardization</text><text x="715" y="501" text-anchor="middle" font-size="15" fill="#475569">Scale a standardized system</text><text x="715" y="525" text-anchor="middle" font-size="15" fill="#475569">across markets</text></g>
</svg>
