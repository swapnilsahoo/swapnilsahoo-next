<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Designing around local shaving conditions</title><desc id="desc">A handheld mirror, cup of water, and easy-rinse single-blade razor illustrate why observing the local context changes product design.</desc><rect width="900" height="620" rx="28" fill="#f8fafc"/>
  <text x="450" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Observe the context before redesigning the product</text><text x="450" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748b">The user’s routine reveals constraints that a laboratory can miss.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="55" y="160" width="230" height="300" rx="24" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><circle cx="170" cy="245" r="62" fill="white" stroke="#0284c7" stroke-width="8"/><rect x="160" y="303" width="20" height="78" rx="10" fill="#0284c7"/><text x="170" y="415" font-size="20" font-weight="700" fill="#0c4a6e">Handheld mirror</text>
  <rect x="335" y="160" width="230" height="300" rx="24" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><path d="M395 235 H505 L490 350 Q450 382 410 350 Z" fill="white" stroke="#7c3aed" stroke-width="7"/><path d="M407 300 Q450 280 493 300" fill="none" stroke="#38bdf8" stroke-width="10"/><text x="450" y="415" font-size="20" font-weight="700" fill="#4c1d95">Cup of water</text>
  <rect x="615" y="160" width="230" height="300" rx="24" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><rect x="720" y="225" width="20" height="145" rx="10" fill="#16a34a"/><rect x="675" y="210" width="110" height="35" rx="10" fill="white" stroke="#16a34a" stroke-width="7"/><path d="M690 227 H770" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 6"/><text x="730" y="415" font-size="20" font-weight="700" fill="#14532d">Easy-rinse design</text></g>
  <path d="M285 310 H325 M565 310 H605" stroke="#475569" stroke-width="5"/><path d="M315 300 l15 10-15 10 M595 300 l15 10-15 10" fill="#475569"/>
  <rect x="150" y="500" width="600" height="70" rx="18" fill="#0f172a"/><text x="450" y="531" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="white">Local constraint → product requirement → better adoption</text><text x="450" y="555" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#cbd5e1">Contextual observation is part of strategy, not a late-stage marketing adjustment.</text>
</svg>
