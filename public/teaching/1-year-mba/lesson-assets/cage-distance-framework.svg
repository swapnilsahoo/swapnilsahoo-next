<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">CAGE distance framework</title><desc id="desc">Cultural, administrative, geographic, and economic distance shape the attractiveness and difficulty of entering a country.</desc><rect width="1000" height="650" rx="28" fill="#f8fafc"/>
  <text x="500" y="60" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Distance is more than kilometres</text><text x="500" y="97" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748b">Compare a target market across four distinct sources of friction.</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="65" y="145" width="410" height="190" rx="22" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/><circle cx="115" cy="195" r="27" fill="#db2777"/><text x="115" y="203" text-anchor="middle" font-size="22" font-weight="700" fill="white">C</text><text x="158" y="204" font-size="24" font-weight="700" fill="#831843">Cultural</text><text x="100" y="250" font-size="16" fill="#334155">Language · values · religion · norms</text><text x="100" y="285" font-size="15" fill="#64748b">Will customers interpret and use the offer differently?</text>
  <rect x="525" y="145" width="410" height="190" rx="22" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><circle cx="575" cy="195" r="27" fill="#2563eb"/><text x="575" y="203" text-anchor="middle" font-size="22" font-weight="700" fill="white">A</text><text x="618" y="204" font-size="24" font-weight="700" fill="#1e3a8a">Administrative</text><text x="560" y="250" font-size="16" fill="#334155">Law · policy · currency · institutional ties</text><text x="560" y="285" font-size="15" fill="#64748b">What permissions, protections, and obligations differ?</text>
  <rect x="65" y="375" width="410" height="190" rx="22" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><circle cx="115" cy="425" r="27" fill="#16a34a"/><text x="115" y="433" text-anchor="middle" font-size="22" font-weight="700" fill="white">G</text><text x="158" y="434" font-size="24" font-weight="700" fill="#14532d">Geographic</text><text x="100" y="480" font-size="16" fill="#334155">Distance · time zones · terrain · infrastructure</text><text x="100" y="515" font-size="15" fill="#64748b">How hard is coordination, movement, and service?</text>
  <rect x="525" y="375" width="410" height="190" rx="22" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><circle cx="575" cy="425" r="27" fill="#d97706"/><text x="575" y="433" text-anchor="middle" font-size="22" font-weight="700" fill="white">E</text><text x="618" y="434" font-size="24" font-weight="700" fill="#78350f">Economic</text><text x="560" y="480" font-size="16" fill="#334155">Income · input costs · capabilities · market structure</text><text x="560" y="515" font-size="15" fill="#64748b">Does the business model fit local economics?</text></g>
  <text x="500" y="612" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">Use CAGE comparatively: distance is relative to the home country and to alternative markets.</text>
</svg>
