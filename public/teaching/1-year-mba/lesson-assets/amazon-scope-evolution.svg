<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Amazon scope evolution</title><desc id="desc">A timeline shows Amazon broadening from books to marketplace, cloud infrastructure, devices and media, and an integrated logistics and retail system.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/></marker></defs><rect width="1000" height="520" rx="28" fill="#0f172a"/>
  <text x="500" y="66" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#f8fafc">How capabilities widened Amazon’s corporate scope</text><text x="500" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#94a3b8">Each move reused or extended infrastructure, data, relationships, and customer access.</text>
  <path d="M105 280 H895" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g><circle cx="140" cy="280" r="18" fill="#fbbf24"/><rect x="65" y="145" width="150" height="90" rx="16" fill="#1e293b" stroke="#475569"/><text x="140" y="182" font-size="18" font-weight="700" fill="white">Books</text><text x="140" y="209" font-size="14" fill="#cbd5e1">Focused retail</text></g><g><circle cx="320" cy="280" r="18" fill="#fbbf24"/><rect x="245" y="315" width="150" height="90" rx="16" fill="#1e293b" stroke="#475569"/><text x="320" y="352" font-size="18" font-weight="700" fill="white">Marketplace</text><text x="320" y="379" font-size="14" fill="#cbd5e1">Platform scale</text></g><g><circle cx="500" cy="280" r="18" fill="#fbbf24"/><rect x="425" y="145" width="150" height="90" rx="16" fill="#1e293b" stroke="#475569"/><text x="500" y="182" font-size="18" font-weight="700" fill="white">AWS</text><text x="500" y="209" font-size="14" fill="#cbd5e1">Infrastructure</text></g><g><circle cx="680" cy="280" r="18" fill="#fbbf24"/><rect x="605" y="315" width="150" height="90" rx="16" fill="#1e293b" stroke="#475569"/><text x="680" y="352" font-size="18" font-weight="700" fill="white">Media + devices</text><text x="680" y="379" font-size="14" fill="#cbd5e1">Ecosystem reach</text></g><g><circle cx="860" cy="280" r="18" fill="#fbbf24"/><rect x="785" y="145" width="150" height="90" rx="16" fill="#1e293b" stroke="#475569"/><text x="860" y="182" font-size="18" font-weight="700" fill="white">Logistics + retail</text><text x="860" y="209" font-size="14" fill="#cbd5e1">End-to-end control</text></g></g>
  <text x="500" y="468" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#fbbf24">Corporate-strategy test: does the parent create more value than separate businesses could?</text>
</svg>
