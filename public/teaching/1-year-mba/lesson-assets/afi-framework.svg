<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">AFI strategy framework</title>
  <desc id="desc">Analysis informs formulation, formulation guides implementation, and implementation produces feedback for renewed analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="960" height="560" rx="28" fill="url(#bg)"/>
  <text x="480" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">AFI: strategy as a continuous learning loop</text>
  <text x="480" y="101" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Ask what is true, choose where and how to compete, then learn from execution.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="170" width="240" height="190" rx="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="115" cy="215" r="22" fill="#2563eb"/><text x="115" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="white">A</text>
    <text x="190" y="221" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a">Analysis</text>
    <text x="95" y="270" font-size="16" fill="#334155">• External environment</text><text x="95" y="301" font-size="16" fill="#334155">• Resources and capabilities</text><text x="95" y="332" font-size="16" fill="#334155">• Stakeholders and purpose</text>
    <rect x="360" y="170" width="240" height="190" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="405" cy="215" r="22" fill="#7c3aed"/><text x="405" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="white">F</text>
    <text x="480" y="221" text-anchor="middle" font-size="25" font-weight="700" fill="#4c1d95">Formulation</text>
    <text x="385" y="270" font-size="16" fill="#334155">• Strategic position</text><text x="385" y="301" font-size="16" fill="#334155">• Trade-offs and scope</text><text x="385" y="332" font-size="16" fill="#334155">• Coherent choices</text>
    <rect x="650" y="170" width="240" height="190" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <circle cx="695" cy="215" r="22" fill="#16a34a"/><text x="695" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="white">I</text>
    <text x="770" y="221" text-anchor="middle" font-size="25" font-weight="700" fill="#14532d">Implementation</text>
    <text x="675" y="270" font-size="16" fill="#334155">• Activities and structure</text><text x="675" y="301" font-size="16" fill="#334155">• Measures and incentives</text><text x="675" y="332" font-size="16" fill="#334155">• Adaptation in practice</text>
  </g>
  <path d="M312 265 H350" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/><path d="M602 265 H640" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M770 375 C770 485 190 485 190 375" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="480" y="472" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#1d4ed8">Results and surprises create feedback for the next cycle</text>
</svg>
