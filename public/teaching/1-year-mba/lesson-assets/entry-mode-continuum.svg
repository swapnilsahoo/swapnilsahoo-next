<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">Foreign market entry mode continuum</title><desc id="desc">Exporting, licensing, alliance, joint venture, acquisition, and greenfield investment rise progressively in investment, control, and exposure.</desc><defs><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bfdbfe"/><stop offset="1" stop-color="#4338ca"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4338ca"/></marker></defs><rect width="1000" height="580" rx="28" fill="#f8fafc"/>
  <text x="500" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Entry modes trade commitment for control</text><text x="500" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748b">The “best” mode depends on learning needs, risk, intellectual property, and reversibility.</text>
  <rect x="90" y="175" width="820" height="18" rx="9" fill="url(#bar)"/><path d="M90 235 H910" stroke="#4338ca" stroke-width="3" marker-end="url(#a)"/><text x="90" y="265" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#475569">LOWER INVESTMENT + CONTROL</text><text x="910" y="265" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#312e81">HIGHER INVESTMENT + CONTROL</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g transform="translate(100 315)"><circle cx="55" cy="30" r="28" fill="#dbeafe" stroke="#60a5fa"/><text x="55" y="38" font-size="20" font-weight="700" fill="#1e40af">1</text><text x="55" y="85" font-size="17" font-weight="700" fill="#0f172a">Export</text></g><g transform="translate(235 315)"><circle cx="55" cy="30" r="28" fill="#dbeafe" stroke="#60a5fa"/><text x="55" y="38" font-size="20" font-weight="700" fill="#1e40af">2</text><text x="55" y="85" font-size="17" font-weight="700" fill="#0f172a">License</text></g><g transform="translate(370 315)"><circle cx="55" cy="30" r="28" fill="#e0e7ff" stroke="#818cf8"/><text x="55" y="38" font-size="20" font-weight="700" fill="#3730a3">3</text><text x="55" y="85" font-size="17" font-weight="700" fill="#0f172a">Alliance</text></g><g transform="translate(505 315)"><circle cx="55" cy="30" r="28" fill="#e0e7ff" stroke="#818cf8"/><text x="55" y="38" font-size="20" font-weight="700" fill="#3730a3">4</text><text x="55" y="85" font-size="17" font-weight="700" fill="#0f172a">Joint venture</text></g><g transform="translate(640 315)"><circle cx="55" cy="30" r="28" fill="#ddd6fe" stroke="#8b5cf6"/><text x="55" y="38" font-size="20" font-weight="700" fill="#5b21b6">5</text><text x="55" y="85" font-size="17" font-weight="700" fill="#0f172a">Acquisition</text></g><g transform="translate(775 315)"><circle cx="55" cy="30" r="28" fill="#c4b5fd" stroke="#7c3aed"/><text x="55" y="38" font-size="20" font-weight="700" fill="#4c1d95">6</text><text x="55" y="85" font-size="17" font-weight="700" fill="#0f172a">Greenfield</text></g></g>
  <rect x="140" y="470" width="720" height="60" rx="16" fill="#eef2ff" stroke="#c7d2fe"/><text x="500" y="507" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3730a3">Control rises—but so do capital at risk, integration demands, and exit costs.</text>
</svg>
