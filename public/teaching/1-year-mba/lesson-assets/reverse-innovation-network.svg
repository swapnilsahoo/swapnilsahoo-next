<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Polycentric reverse-innovation network</title><desc id="desc">Research hubs in New York, Munich, Bangalore, and Shanghai exchange knowledge; affordable innovations developed in emerging markets can travel worldwide.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker></defs><rect width="960" height="620" rx="28" fill="#faf5ff"/>
  <text x="480" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">Innovation can begin anywhere—and travel both ways</text><text x="480" y="99" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748b">A polycentric network treats multiple research hubs as sources, not satellites.</text>
  <g stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M270 220 L430 305"/><path d="M690 220 L530 305"/><path d="M270 450 L430 345"/><path d="M690 450 L530 345"/><path d="M300 220 H650"/><path d="M300 450 H650"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><circle cx="480" cy="325" r="95" fill="#7c3aed"/><text x="480" y="314" font-size="23" font-weight="700" fill="white">Shared learning</text><text x="480" y="344" font-size="15" fill="#ede9fe">knowledge · talent · trials</text>
  <rect x="120" y="155" width="190" height="115" rx="20" fill="white" stroke="#c4b5fd"/><text x="215" y="199" font-size="21" font-weight="700" fill="#4c1d95">New York</text><text x="215" y="230" font-size="14" fill="#64748b">Global research</text>
  <rect x="650" y="155" width="190" height="115" rx="20" fill="white" stroke="#c4b5fd"/><text x="745" y="199" font-size="21" font-weight="700" fill="#4c1d95">Munich</text><text x="745" y="230" font-size="14" fill="#64748b">Engineering cluster</text>
  <rect x="120" y="400" width="190" height="125" rx="20" fill="#dcfce7" stroke="#4ade80"/><text x="215" y="442" font-size="21" font-weight="700" fill="#166534">Bangalore</text><text x="215" y="473" font-size="14" fill="#334155">MAC 400: frugal ECG</text><text x="215" y="497" font-size="13" fill="#64748b">local need → global option</text>
  <rect x="650" y="400" width="190" height="125" rx="20" fill="#dcfce7" stroke="#4ade80"/><text x="745" y="442" font-size="21" font-weight="700" fill="#166534">Shanghai</text><text x="745" y="473" font-size="14" fill="#334155">Portable diagnostics</text><text x="745" y="497" font-size="13" fill="#64748b">local need → global option</text></g>
</svg>
