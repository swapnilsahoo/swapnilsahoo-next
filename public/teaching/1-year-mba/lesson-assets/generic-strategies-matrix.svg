<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Generic business strategies matrix</title><desc id="desc">A two-by-two matrix combines broad or narrow competitive scope with lower cost or distinctiveness.</desc>
  <rect width="960" height="620" rx="28" fill="#f8fafc"/>
  <text x="510" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0f172a">Two choices define the competitive position</text>
  <text x="510" y="91" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">What advantage will we build—and how broad is the market we will serve?</text>
  <g font-family="Inter,Arial,sans-serif">
    <text x="507" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">SOURCE OF ADVANTAGE</text>
    <text x="360" y="163" text-anchor="middle" font-size="16" fill="#475569">Lower delivered cost</text><text x="660" y="163" text-anchor="middle" font-size="16" fill="#475569">Distinctive buyer value</text>
    <text x="68" y="365" text-anchor="middle" transform="rotate(-90 68 365)" font-size="17" font-weight="700" fill="#334155">COMPETITIVE SCOPE</text>
    <text x="155" y="286" text-anchor="middle" font-size="16" fill="#475569">Broad</text><text x="155" y="476" text-anchor="middle" font-size="16" fill="#475569">Narrow</text>
    <rect x="210" y="185" width="300" height="180" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><rect x="510" y="185" width="300" height="180" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="210" y="365" width="300" height="180" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><rect x="510" y="365" width="300" height="180" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
    <text x="360" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">Cost leadership</text><text x="360" y="291" text-anchor="middle" font-size="15" fill="#334155">Efficient system serving</text><text x="360" y="315" text-anchor="middle" font-size="15" fill="#334155">a broad market</text>
    <text x="660" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#4c1d95">Differentiation</text><text x="660" y="291" text-anchor="middle" font-size="15" fill="#334155">Unique value recognized</text><text x="660" y="315" text-anchor="middle" font-size="15" fill="#334155">across a broad market</text>
    <text x="360" y="435" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Focused cost</text><text x="360" y="471" text-anchor="middle" font-size="15" fill="#334155">Lowest-cost offer for a</text><text x="360" y="495" text-anchor="middle" font-size="15" fill="#334155">well-defined segment</text>
    <text x="660" y="435" text-anchor="middle" font-size="23" font-weight="700" fill="#92400e">Focused differentiation</text><text x="660" y="471" text-anchor="middle" font-size="15" fill="#334155">Specialized value for a</text><text x="660" y="495" text-anchor="middle" font-size="15" fill="#334155">well-defined segment</text>
  </g>
</svg>
