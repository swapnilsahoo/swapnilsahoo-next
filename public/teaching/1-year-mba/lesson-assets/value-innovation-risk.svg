<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
  <title id="title">Value innovation and stuck-in-the-middle risk</title><desc id="desc">Coordinated choices can raise buyer value and lower cost, while inconsistent choices create an unclear offer and an expensive activity system.</desc>
  <rect width="960" height="590" rx="28" fill="#f8fafc"/><text x="480" y="66" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">The difference is coherence, not ambition</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="75" y="125" width="365" height="365" rx="26" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/><circle cx="130" cy="182" r="27" fill="#059669"/><path d="M117 182 l9 10 19-23" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="175" y="190" font-size="25" font-weight="700" fill="#065f46">Value innovation</text><text x="115" y="245" font-size="17" font-weight="700" fill="#334155">One reinforcing activity system</text><text x="115" y="285" font-size="16" fill="#475569">• Remove low-value complexity</text><text x="115" y="320" font-size="16" fill="#475569">• Invest in decisive buyer value</text><text x="115" y="355" font-size="16" fill="#475569">• Align operations and promise</text><rect x="115" y="405" width="285" height="50" rx="14" fill="#d1fae5"/><text x="257" y="436" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Clear value + sustainable economics</text>
    <rect x="520" y="125" width="365" height="365" rx="26" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/><circle cx="575" cy="182" r="27" fill="#e11d48"/><path d="M563 170 l24 24 M587 170 l-24 24" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="620" y="190" font-size="25" font-weight="700" fill="#9f1239">Stuck in the middle</text><text x="560" y="245" font-size="17" font-weight="700" fill="#334155">Contradictory or underfunded choices</text><text x="560" y="285" font-size="16" fill="#475569">• Premium costs without distinction</text><text x="560" y="320" font-size="16" fill="#475569">• Low prices without cost advantage</text><text x="560" y="355" font-size="16" fill="#475569">• Activities pull in opposite directions</text><rect x="560" y="405" width="285" height="50" rx="14" fill="#ffe4e6"/><text x="702" y="436" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">Unclear value + inferior economics</text>
  </g>
</svg>
